name: Build YouTube AdBlock TV APK

# Self-contained: no other files needed in the repo.
# Generates a tiny Android TV app (WebView -> youtube.com/tv, original YouTube UI)
# and injects:
#   1. adblock.js   - ad-data stripper (technique from TizenTube's ad blocker, GPL-3.0)
#   2. glass.js     - transparent-blur skin for the watch PLAYER controls (no black boxes behind text,
#                     blur Description/Subscribe/buttons, seek bar + glider) and a dotted circular
#                     loading spinner replacing "Loading..." on every page
#   3. inspector.js - debug capture tool (only when DEBUG_TOOLS = true)
#
# DEBUG CAPTURE TOOL (set DEBUG_TOOLS=false in MainActivity.java to remove it):
# a small "CAP" button at the top-right opens a menu to pick any item by tapping it,
# dump the visible UI, save the complete page JS, or save the HTML + CSS.
# Each capture is saved to Downloads/YTCapture and opens the Android share sheet.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate Android project
        run: |
          P="$GITHUB_WORKSPACE/_android"
          J="$P/app/src/main/java/com/local/ytadblock/tv"
          mkdir -p "$J" "$P/app/src/main/assets" "$P/app/src/main/res/drawable" "$P/app/src/main/res/xml"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YtAdBlockTv"
          include ':app'
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.local.ytadblock.tv'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.local.ytadblock.tv'
                  minSdk 21
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "1")
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
                      keyAlias System.getenv("KEY_ALIAS") ?: "key"
                      keyPassword System.getenv("KEY_PASSWORD") ?: "android"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="YouTube AdBlock"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation|uiMode|screenLayout|smallestScreenSize|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Lets the capture tool share saved files through the Android share sheet -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.local.ytadblock.tv.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > "$P/app/src/main/res/xml/file_paths.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="captures_ext" path="captures/" />
              <files-path name="captures_int" path="captures/" />
          </paths>
          EOF

          cat > "$P/app/src/main/res/drawable/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp" android:height="96dp"
              android:viewportWidth="96" android:viewportHeight="96">
              <path android:fillColor="#FF0000" android:pathData="M0,0h96v96h-96z" />
              <path android:fillColor="#FFFFFF" android:pathData="M38,28L38,68L70,48z" />
          </vector>
          EOF

          cat > "$P/app/src/main/res/drawable/banner.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp"
              android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#0F0F0F" android:pathData="M0,0h320v180h-320z" />
              <path android:fillColor="#FF0000" android:pathData="M120,60h80a16,16 0 0 1 16,16v28a16,16 0 0 1 -16,16h-80a16,16 0 0 1 -16,-16v-28a16,16 0 0 1 16,-16z" />
              <path android:fillColor="#FFFFFF" android:pathData="M150,78L150,102L174,90z" />
          </vector>
          EOF

          # ---- Script 1: strips ad data from YouTube responses (unchanged) ----
          cat > "$P/app/src/main/assets/adblock.js" <<'EOF'
          (function () {
            if (window.__ytAdBlockMin) return;
            window.__ytAdBlockMin = true;

            function prune(r) {
              try {
                if (!r || typeof r !== 'object' || Array.isArray(r)) return r;

                if (r.adPlacements) r.adPlacements = [];
                if (r.playerAds) r.playerAds = false;
                if (r.adSlots) r.adSlots = [];

                var shelves = r.contents && r.contents.tvBrowseRenderer &&
                  r.contents.tvBrowseRenderer.content &&
                  r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer &&
                  r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer.content &&
                  r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer.content.sectionListRenderer &&
                  r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer.content.sectionListRenderer.contents;
                if (Array.isArray(shelves)) {
                  var list = r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer.content.sectionListRenderer;
                  list.contents = shelves.filter(function (s) { return !s.adSlotRenderer; });
                  list.contents.forEach(function (s) {
                    var h = s.shelfRenderer && s.shelfRenderer.content &&
                      s.shelfRenderer.content.horizontalListRenderer;
                    if (h && Array.isArray(h.items)) {
                      h.items = h.items.filter(function (i) { return !i.adSlotRenderer; });
                    }
                  });
                }

                if (Array.isArray(r.entries)) {
                  r.entries = r.entries.filter(function (e) {
                    return !(e && e.command && e.command.reelWatchEndpoint &&
                      e.command.reelWatchEndpoint.adClientParams &&
                      e.command.reelWatchEndpoint.adClientParams.isAd);
                  });
                }
              } catch (e) { /* never break the page */ }
              return r;
            }

            var origParse = JSON.parse;
            JSON.parse = function () {
              return prune(origParse.apply(this, arguments));
            };

            if (window.Response && Response.prototype.json) {
              var origJson = Response.prototype.json;
              Response.prototype.json = function () {
                return origJson.apply(this, arguments).then(prune);
              };
            }

            var origStringify = JSON.stringify;
            JSON.stringify = function (value, replacer, space) {
              try {
                var ctx = value && value.playbackContext && value.playbackContext.contentPlaybackContext;
                if (ctx && !ctx.isInlinePlaybackNoAd) {
                  var copy = origParse(origStringify(value));
                  copy.playbackContext.contentPlaybackContext.isInlinePlaybackNoAd = true;
                  return origStringify.call(this, copy, replacer, space);
                }
              } catch (e) { /* fall through */ }
              return origStringify.call(this, value, replacer, space);
            };

            // YouTube TV keeps its own JSON reference in window._yttv; point it at ours.
            window.addEventListener('load', function () {
              try {
                var y = window._yttv;
                if (y) for (var k in y) {
                  if (y[k] && y[k].JSON && y[k].JSON.parse) y[k].JSON.parse = JSON.parse;
                }
              } catch (e) { }
            });
          })();
          EOF

          # ---- Script 2: transparent-blur glass on the PLAYER controls + dotted loading spinner ----
          # Class names on YouTube TV are obfuscated, so glass.js reads the real colour of small elements
          # on the watch page and tags them (dark pill -> blur, white -> near-white). It runs from a
          # MutationObserver so it is applied before the next paint. Menus / side panels (Settings) are skipped.
          # "Loading..." text and buffering are replaced with a circular dotted spinner on every page.
          cat > "$P/app/src/main/assets/glass.js" <<'EOF'
          (function () {
            if (window.__ytGlass) return;
            window.__ytGlass = true;

            var CSS = [
              /* no black boxes behind text on the watch page + soft shadow for readability */
              'body.WEB_PAGE_TYPE_WATCH yt-formatted-string,',
              'body.WEB_PAGE_TYPE_WATCH span[idomkey]{',
              '  background:transparent !important;background-color:transparent !important;',
              '  text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 14px rgba(0,0,0,.55);}',

              /* plain transparent blur (original YouTube look, no shine) */
              'html:not([data-ytg-probe]) [data-ytg="dark"]{',
              '  background:rgba(255,255,255,.15) !important;',
              '  -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);}',
              'html:not([data-ytg-probe]) [data-ytg="mid"]{',
              '  background:rgba(255,255,255,.32) !important;',
              '  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}',
              /* focused button / played bar / glider: original near-white */
              'html:not([data-ytg-probe]) [data-ytg="light"]{',
              '  background:rgba(241,241,241,.95) !important;}',

              /* "Loading..." text is hidden, dotted spinner is drawn instead */
              '[data-ytg-loadtext]{color:transparent !important;-webkit-text-fill-color:transparent !important;text-shadow:none !important;}',
              '[data-ytg-hide]{visibility:hidden !important;}',
              '#ytg-spin{position:fixed;width:44px;height:44px;z-index:2147483647;pointer-events:none;display:none;}',
              '#ytg-spin i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;',
              '  border-radius:50%;background:#fff;opacity:.12;animation:ytg-fade 1.2s linear infinite;}',
              '@keyframes ytg-fade{0%{opacity:1}100%{opacity:.12}}'
            ].join('\n');

            var style = null;
            function inject() {
              if (style && style.isConnected) return;
              if (!style) { style = document.createElement('style'); style.id = 'yt-glass-css'; }
              style.textContent = CSS;
              (document.head || document.documentElement).appendChild(style);
            }

            function isWatch() {
              return !!document.body && /WEB_PAGE_TYPE_WATCH/.test(document.body.className);
            }

            function parse(c) {
              var m = c && c.match(/rgba?\(([^)]+)\)/);
              if (!m) return null;
              var p = m[1].split(',').map(parseFloat);
              return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
            }

            function mark(el, state, thin) {
              if (state) {
                if (el.getAttribute('data-ytg') !== state) el.setAttribute('data-ytg', state);
              } else if (el.hasAttribute('data-ytg')) {
                el.removeAttribute('data-ytg');
              }
            }

            var SKIP = { VIDEO: 1, IMG: 1, IMAGE: 1, 'YTLR-PLAYER': 1, SCRIPT: 1, STYLE: 1,
              'YT-FORMATTED-STRING': 1, SPAN: 1, SVG: 1, PATH: 1 };

            // Anything inside a menu / dialog (e.g. the panel that opens after tapping Settings) is left untouched.
            var MENU_TAG = /menu|dialog|popup|modal|dropdown/i;
            var MENU_ROLE = /^(menu|menubar|dialog|alertdialog|listbox)$/i;
            function inMenu(el) {
              for (var n = 0, p = el; p && p.nodeType === 1 && n < 12; p = p.parentElement, n++) {
                if (MENU_TAG.test(p.tagName) || MENU_ROLE.test(p.getAttribute('role') || '') ||
                    p.getAttribute('aria-modal') === 'true') return true;
              }
              return false;
            }
            function inAny(rects, x, y) {
              for (var i = 0; i < rects.length; i++) {
                var r = rects[i];
                if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true;
              }
              return false;
            }

            // ---------- glass on the player controls (watch page only) ----------
            function pass() {
              if (document.hidden || !document.body || !isWatch()) return;
              var root = document.documentElement;
              var all = document.body.getElementsByTagName('*');
              var W = innerWidth, H = innerHeight;
              // Glass rules are switched OFF while reading the real colours, then ON again in the same
              // task, so the screen never shows the un-glassed state.
              root.setAttribute('data-ytg-probe', '1');
              try {
                var els = [], rects = [], panels = [], i, el, r, cs;
                for (i = 0; i < all.length; i++) {
                  el = all[i];
                  if (SKIP[el.tagName.toUpperCase()]) { mark(el, null); continue; }
                  r = el.getBoundingClientRect();
                  els.push(el); rects.push(r);
                  // a tall side panel (settings menu) -> remember its area, nothing inside it gets glass
                  if (r.height >= H * 0.85 && r.width >= 180 && r.width <= W * 0.7 && r.right > 0 && r.left < W) {
                    cs = getComputedStyle(el);
                    var pb = parse(cs.backgroundColor);
                    if ((pb && pb.a > 0.05) || (cs.backgroundImage && cs.backgroundImage !== 'none')) panels.push(r);
                  }
                }
                for (i = 0; i < els.length; i++) {
                  el = els[i]; r = rects[i];
                  if (r.width < 6 || r.height < 3 || r.right < 0 || r.bottom < 0 || r.left > W || r.top > H) {
                    mark(el, null); continue;
                  }
                  var thin = r.height <= 12;
                  if (!thin && (r.height > 80 || r.width > 400)) { mark(el, null); continue; }
                  if (panels.length && inAny(panels, r.left + r.width / 2, r.top + r.height / 2)) {
                    mark(el, null); continue;
                  }
                  cs = getComputedStyle(el);
                  if (cs.visibility === 'hidden' || cs.display === 'none' ||
                      (cs.backgroundImage && cs.backgroundImage !== 'none')) { mark(el, null); continue; }
                  var bg = parse(cs.backgroundColor);
                  if (!bg || bg.a < 0.05) { mark(el, null); continue; }
                  var lum = (0.299 * bg.r + 0.587 * bg.g + 0.114 * bg.b) / 255;
                  var state = lum < 0.55 ? 'dark' : (bg.a < 0.6 ? 'mid' : 'light');
                  var p = el.parentElement;
                  if (!thin && state === 'dark' && p && p.getAttribute('data-ytg') === 'dark') {
                    mark(el, null); continue;
                  }
                  if (inMenu(el)) { mark(el, null); continue; }
                  mark(el, state);
                }
              } finally {
                root.removeAttribute('data-ytg-probe');
              }
            }

            // ---------- dotted circular spinner instead of "Loading…" (every page) ----------
            var spin = null;
            function ensureSpin() {
              if (spin && spin.isConnected) return spin;
              spin = document.createElement('div');
              spin.id = 'ytg-spin';
              for (var i = 0; i < 12; i++) {
                var d = document.createElement('i');
                d.style.transform = 'rotate(' + (i * 30) + 'deg) translateY(-17px)';
                d.style.animationDelay = (i * 0.1 - 1.2).toFixed(1) + 's';
                spin.appendChild(d);
              }
              document.documentElement.appendChild(spin);   // outside <body>, so it never triggers the observer
              return spin;
            }

            var LOAD_RE = /^loading(\u2026|\.{3})?$/i;
            function visibleRect(el) {
              var r = el.getBoundingClientRect();
              return (r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < innerHeight &&
                      r.right > 0 && r.left < innerWidth) ? r : null;
            }

            function spinPass() {
              if (!document.body) return;
              var s = ensureSpin(), target = null, i, el, r;

              var fs = document.getElementsByTagName('yt-formatted-string');
              for (i = 0; i < fs.length; i++) {
                el = fs[i];
                var t = el.textContent;
                if (t && t.length < 14 && LOAD_RE.test(t.trim()) && (r = visibleRect(el))) {
                  if (!el.hasAttribute('data-ytg-loadtext')) el.setAttribute('data-ytg-loadtext', '1');
                  if (!target) target = r;
                } else if (el.hasAttribute('data-ytg-loadtext')) {
                  el.removeAttribute('data-ytg-loadtext');
                }
              }

              // YouTube's own spinner elements (if any) are hidden and replaced by ours
              var ns = document.querySelectorAll('ytlr-spinner,yt-spinner,ytlr-loading-spinner,yt-loading-spinner');
              for (i = 0; i < ns.length; i++) {
                el = ns[i];
                if ((r = visibleRect(el)) && r.width < 220 && r.height < 220) {
                  if (!el.hasAttribute('data-ytg-hide')) el.setAttribute('data-ytg-hide', '1');
                  if (!target) target = r;
                }
              }

              // video buffering / loading on the player page
              if (!target && isWatch()) {
                var v = document.querySelector('video');
                if (v && v.currentSrc && v.readyState < 3 && !v.error && (r = visibleRect(v)) && r.width > 50) target = r;
              }

              if (target) {
                s.style.left = Math.round(target.left + target.width / 2 - 22) + 'px';
                s.style.top = Math.round(target.top + target.height / 2 - 22) + 'px';
                s.style.display = 'block';
              } else {
                s.style.display = 'none';
              }
            }

            // ---------- scheduling: apply BEFORE the next paint, not on a slow timer ----------
            var last = 0, pending = false;
            function run() {
              last = performance.now();
              try { inject(); pass(); } catch (e) { }
              try { spinPass(); } catch (e) { }
            }
            function schedule() {
              var now = performance.now();
              if (now - last >= 60) { run(); }          // runs inside the mutation microtask = before paint
              else if (!pending) {
                pending = true;
                setTimeout(function () { pending = false; run(); }, 60 - (now - last) + 1);
              }
            }

            var mo = null;
            function observe() {
              if (mo || !document.body) return;
              mo = new MutationObserver(schedule);
              mo.observe(document.body, { childList: true, subtree: true,
                attributes: true, attributeFilter: ['class', 'style'] });
            }

            inject();
            observe();
            setInterval(function () { observe(); run(); }, 250);
          })();
          EOF

          # ---- Script 3: capture / inspector helpers (passive until a menu button is used) ----
          cat > "$P/app/src/main/assets/inspector.js" <<'EOF'
          (function () {
            if (window.__cap) return;
            var cap = window.__cap = {};
            var picking = false;

            function pad(n) { return (n < 10 ? '0' : '') + n; }
            function stamp() {
              var d = new Date();
              return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' +
                pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
            }
            function toast(m) { try { if (window.YTCap) YTCap.toast(String(m)); } catch (e) { } }
            function send(name, text) {
              if (!window.YTCap) return;
              YTCap.begin();
              var n = 200000;
              for (var i = 0; i < text.length; i += n) YTCap.chunk(text.slice(i, i + n));
              YTCap.end(name);
            }
            function safeJson(o, space) {
              var seen = new WeakSet();
              try {
                return JSON.stringify(o, function (k, v) {
                  if (typeof v === 'function') return '[fn]';
                  if (v && typeof v === 'object') {
                    if (v.nodeType) return '[node]';
                    if (seen.has(v)) return '[circular]';
                    seen.add(v);
                  }
                  return v;
                }, space);
              } catch (e) { return '"[unserializable: ' + e + ']"'; }
            }

            function cls(el) {
              var c = el.getAttribute && el.getAttribute('class');
              return c ? c.trim() : '';
            }
            function sel(el) {
              var s = (el.tagName || '?').toLowerCase();
              if (el.id) s += '#' + el.id;
              var c = cls(el).split(/\s+/).filter(Boolean).slice(0, 6).join('.');
              if (c) s += '.' + c;
              var k = el.getAttribute && el.getAttribute('idomkey');
              if (k) s += '[idomkey="' + k + '"]';
              return s;
            }
            function r1(n) { return Math.round(n * 10) / 10; }

            var PROPS = ['backgroundColor', 'backgroundImage', 'color', 'opacity', 'borderRadius', 'boxShadow',
              'display', 'position', 'zIndex', 'visibility', 'filter', 'transform', 'mixBlendMode',
              'overflow', 'width', 'height'];

            function info(el) {
              var r = el.getBoundingClientRect(), cs = getComputedStyle(el), st = {};
              PROPS.forEach(function (p) {
                var v = cs[p];
                if (v && v !== 'none' && v !== 'normal' && v !== 'auto') st[p] = String(v).slice(0, 220);
              });
              var bf = cs.backdropFilter || cs.webkitBackdropFilter;
              if (bf && bf !== 'none') st.backdropFilter = bf;
              var attrs = {};
              if (el.attributes) for (var i = 0; i < el.attributes.length; i++) {
                var a = el.attributes[i];
                if (a.name === 'class' || a.name === 'style') continue;
                attrs[a.name] = String(a.value).slice(0, 80);
              }
              var inline = el.getAttribute && el.getAttribute('style');
              return {
                selector: sel(el),
                tag: (el.tagName || '').toLowerCase(),
                id: el.id || undefined,
                class: cls(el) || undefined,
                idomkey: (el.getAttribute && el.getAttribute('idomkey')) || undefined,
                rect: [r1(r.left), r1(r.top), r1(r.width), r1(r.height)],
                attrs: attrs,
                inlineStyle: inline ? inline.slice(0, 300) : undefined,
                text: ((el.innerText || '') + '').trim().slice(0, 80) || undefined,
                computed: st
              };
            }
            function chain(el) {
              var out = [], n = 0;
              while (el && el.nodeType === 1 && n++ < 12) { out.push(sel(el)); el = el.parentElement; }
              return out;
            }
            function header() {
              var v = document.querySelector('video');
              return {
                captured: new Date().toISOString(),
                url: location.href,
                userAgent: navigator.userAgent,
                viewport: [innerWidth, innerHeight, window.devicePixelRatio],
                bodyClass: document.body ? document.body.className : '',
                video: v ? {
                  rect: (function () { var r = v.getBoundingClientRect(); return [r1(r.left), r1(r.top), r1(r.width), r1(r.height)]; })(),
                  currentTime: v.currentTime, duration: v.duration, readyState: v.readyState,
                  paused: v.paused, playbackRate: v.playbackRate,
                  src: (v.currentSrc || v.src || '').slice(0, 80)
                } : null
              };
            }
            function flash(el) {
              try {
                var r = el.getBoundingClientRect(), d = document.createElement('div');
                d.style.cssText = 'position:fixed;z-index:2147483647;pointer-events:none;border:3px solid #0f0;' +
                  'background:rgba(0,255,0,.15);left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width +
                  'px;height:' + r.height + 'px';
                document.documentElement.appendChild(d);
                setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1500);
              } catch (e) { }
            }

            // ---- 1. Pick: tap an item, capture everything stacked at that point ----
            function capturePoint(x, y) {
              var stack = document.elementsFromPoint(x, y).slice(0, 14);
              if (!stack.length) { toast('Nothing found at that point'); return; }
              flash(stack[0]);
              var out = header();
              out.type = 'element-pick';
              out.point = [Math.round(x), Math.round(y)];
              out.ancestorsOfTop = chain(stack[0]);
              out.topOuterHTML = (stack[0].outerHTML || '').slice(0, 1500);
              out.stackTopToBottom = stack.map(info);
              out.tectonicConfig = window.tectonicConfig ? JSON.parse(safeJson(window.tectonicConfig)) : null;
              send('element_' + stamp() + '.txt', safeJson(out, 1));
            }
            cap.pick = function () {
              if (picking) return;
              picking = true;
              toast('Tap the item you want to capture');
              var types = ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'];
              var done = false;
              function handler(e) {
                e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
                if (done) return;
                if (e.type === 'pointerup' || e.type === 'touchend' || e.type === 'mouseup' || e.type === 'click') {
                  var t = (e.changedTouches && e.changedTouches[0]) || e;
                  if (typeof t.clientX !== 'number') return;
                  done = true;
                  capturePoint(t.clientX, t.clientY);
                  setTimeout(function () {
                    types.forEach(function (n) { window.removeEventListener(n, handler, true); });
                    picking = false;
                  }, 600);
                }
              }
              types.forEach(function (n) { window.addEventListener(n, handler, true); });
            };

            // ---- 2. Dump visible UI: every visible, styled element (use after showing the controls) ----
            cap.dumpUi = function () {
              var lines = [], all = document.body.getElementsByTagName('*'), W = innerWidth, H = innerHeight;
              for (var i = 0; i < all.length && lines.length < 1800; i++) {
                var el = all[i], r = el.getBoundingClientRect();
                if (r.width < 8 || r.height < 8 || r.right < 0 || r.bottom < 0 || r.left > W || r.top > H) continue;
                var cs = getComputedStyle(el);
                if (cs.visibility === 'hidden' || cs.display === 'none') continue;
                var bg = cs.backgroundColor, bgi = cs.backgroundImage, bf = cs.backdropFilter || cs.webkitBackdropFilter;
                var hasBg = bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent';
                var hasImg = bgi && bgi !== 'none';
                var hasBf = bf && bf !== 'none';
                var ownText = '';
                for (var c = el.firstChild; c; c = c.nextSibling) if (c.nodeType === 3) ownText += c.nodeValue;
                ownText = ownText.trim().slice(0, 40);
                if (!hasBg && !hasImg && !hasBf && !ownText && el.tagName !== 'VIDEO' && el.tagName !== 'IMG') continue;
                lines.push(sel(el) + ' | rect=' + [r1(r.left), r1(r.top), r1(r.width), r1(r.height)].join(',') +
                  (hasBg ? ' | bg=' + bg : '') + (hasImg ? ' | bgimg=' + bgi.slice(0, 90) : '') +
                  (hasBf ? ' | backdrop=' + bf : '') +
                  (cs.opacity !== '1' ? ' | opacity=' + cs.opacity : '') +
                  (cs.borderRadius !== '0px' ? ' | radius=' + cs.borderRadius : '') +
                  (cs.zIndex !== 'auto' ? ' | z=' + cs.zIndex : '') +
                  (ownText ? ' | text="' + ownText + '"' : ''));
              }
              var text = 'YTCAP visible-UI dump\n' + safeJson(header(), 1) + '\n\n' + lines.join('\n') + '\n';
              send('ui_' + stamp() + '.txt', text);
            };

            // ---- 3. Full HTML + all CSS ----
            cap.dumpDom = function () {
              var out = ['<!-- YTCAP DOM dump ' + new Date().toISOString() + ' | ' + location.href + ' -->',
                document.documentElement.outerHTML, '', '/* ===== CSS (all stylesheets) ===== */'];
              function addSheet(ss, label) {
                try {
                  var rules = ss.cssRules, parts = [];
                  for (var i = 0; i < rules.length; i++) parts.push(rules[i].cssText);
                  out.push('\n/* --- ' + label + ' (' + rules.length + ' rules) --- */\n' + parts.join('\n'));
                } catch (e) { out.push('\n/* --- ' + label + ' unreadable (cross-origin) --- */'); }
              }
              for (var i = 0; i < document.styleSheets.length; i++) {
                var ss = document.styleSheets[i];
                addSheet(ss, ss.href || ('inline #' + i));
              }
              try { (document.adoptedStyleSheets || []).forEach(function (ss, i) { addSheet(ss, 'adopted #' + i); }); } catch (e) { }
              send('dom_' + stamp() + '.txt', out.join('\n'));
            };

            // ---- 4. Complete JS: inline scripts + every external script the page loaded ----
            cap.dumpJs = function () {
              toast('Collecting page JS, please wait...');
              var urls = [], seen = {};
              function add(u) { if (u && !seen[u]) { seen[u] = 1; urls.push(u); } }
              [].forEach.call(document.scripts, function (s) { if (s.src) add(s.src); });
              try {
                performance.getEntriesByType('resource').forEach(function (e) {
                  if (e.initiatorType === 'script' || /\.js(\?|$)/.test(e.name)) add(e.name);
                });
              } catch (e) { }

              var out = ['/* YTCAP JS dump ' + new Date().toISOString() + ' */',
                '/* url: ' + location.href + ' */',
                '/* ua: ' + navigator.userAgent + ' */',
                '/* body class: ' + (document.body ? document.body.className : '') + ' */',
                '/* window._yttv keys: ' + (window._yttv ? Object.keys(window._yttv).join(',') : 'none') + ' */',
                '/* tectonicConfig: */', safeJson(window.tectonicConfig, 1)];
              [].forEach.call(document.scripts, function (s, i) {
                if (!s.src && s.textContent) {
                  out.push('\n/* ===== inline script #' + i + ' (' + s.textContent.length + ' chars) ===== */\n' + s.textContent);
                }
              });

              var total = 0, idx = 0;
              function next() {
                if (idx >= urls.length) {
                  out.push('\n/* total external chars: ' + total + ' in ' + urls.length + ' files */');
                  send('js_' + stamp() + '.txt', out.join('\n'));
                  return;
                }
                var u = urls[idx++];
                if (total > 14000000) {
                  out.push('\n/* ===== ' + u + ' SKIPPED (size cap reached) ===== */');
                  return next();
                }
                fetch(u, { credentials: 'include' })
                  .then(function (r) { return r.text().then(function (t) { return { s: r.status, t: t }; }); })
                  .then(function (r) {
                    total += r.t.length;
                    out.push('\n/* ===== ' + u + ' [' + r.s + ', ' + r.t.length + ' chars] ===== */\n' + r.t);
                  })
                  .catch(function (e) { out.push('\n/* ===== ' + u + ' FAILED: ' + e + ' ===== */'); })
                  .then(next);
              }
              next();
            };
          })();
          EOF

          cat > "$J/MainActivity.java" <<'EOF'
          package com.local.ytadblock.tv;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.core.content.FileProvider;
          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public class MainActivity extends Activity {

              // Set to false to remove the CAP button, the capture bridge and WebView remote debugging.
              private static final boolean DEBUG_TOOLS = true;

              // Set to false to go back to the original YouTube look (no liquid glass).
              private static final boolean GLASS_UI = true;

              private static final String START_URL = "https://www.youtube.com/tv";

              // TV-style user agent so youtube.com serves the original TV (leanback) interface.
              // If you ever get the desktop site or an "unsupported browser" page, change this.
              private static final String TV_UA =
                      "Mozilla/5.0 (SMART-TV; LINUX; Tizen 6.5) AppleWebKit/537.36 (KHTML, like Gecko) "
                              + "85.0.4183.93/6.5 TV Safari/537.36";

              private WebView web;
              private FrameLayout root;
              private LinearLayout panel;
              private final List<String> scripts = new ArrayList<>();
              private boolean scriptAtDocumentStart = false;
              private long lastBack = 0;
              private File lastCapture = null;
              private final Handler ui = new Handler(Looper.getMainLooper());

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  String ad = readAsset("adblock.js");
                  if (!ad.isEmpty()) scripts.add(ad);
                  if (GLASS_UI) {
                      String glass = readAsset("glass.js");
                      if (!glass.isEmpty()) scripts.add(glass);
                  }
                  if (DEBUG_TOOLS) {
                      String insp = readAsset("inspector.js");
                      if (!insp.isEmpty()) scripts.add(insp);
                  }

                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  root = new FrameLayout(this);
                  root.addView(web, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUserAgentString(TV_UA);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  if (DEBUG_TOOLS) {
                      WebView.setWebContentsDebuggingEnabled(true);   // chrome://inspect from a PC
                      web.addJavascriptInterface(new CapBridge(), "YTCap");
                      buildDebugUi();
                  }

                  // Preferred: run before any page script so nothing can capture JSON.parse first.
                  if (!scripts.isEmpty()
                          && WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      for (String js : scripts) {
                          WebViewCompat.addDocumentStartJavaScript(
                                  web, js, Collections.singleton("https://*.youtube.com"));
                      }
                      scriptAtDocumentStart = true;
                  }

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String scheme = r.getUrl().getScheme();
                          // true = block. Only http(s) stays inside the app.
                          return !("https".equals(scheme) || "http".equals(scheme));
                      }

                      @Override
                      public void onPageStarted(WebView v, String url, Bitmap favicon) {
                          // Fallback for old WebView versions without document-start scripts.
                          if (!scriptAtDocumentStart) {
                              for (String js : scripts) v.evaluateJavascript(js, null);
                          }
                      }

                      @Override
                      public boolean onRenderProcessGone(WebView v,
                                                         android.webkit.RenderProcessGoneDetail d) {
                          recreate();
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(START_URL);
                  }
                  web.requestFocus();
              }

              private String readAsset(String name) {
                  try (InputStream in = getAssets().open(name)) {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      return out.toString("UTF-8");
                  } catch (Exception e) {
                      return "";
                  }
              }

              // ------------------------------------------------------------------
              // Debug capture UI: small "CAP" button -> menu
              // ------------------------------------------------------------------
              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              private TextView menuButton(String label, View.OnClickListener l) {
                  TextView t = new TextView(this);
                  t.setText(label);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(14);
                  t.setPadding(dp(14), dp(10), dp(14), dp(10));
                  t.setBackgroundColor(0xE6202020);
                  t.setFocusable(false);
                  t.setOnClickListener(l);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = dp(4);
                  t.setLayoutParams(lp);
                  return t;
              }

              private void runJs(String js) {
                  web.evaluateJavascript(
                          "try{" + js + "}catch(e){window.YTCap&&YTCap.toast('Capture error: '+e)}", null);
              }

              private void buildDebugUi() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.END);

                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setVisibility(View.GONE);

                  TextView bubble = menuButton("CAP", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          panel.setVisibility(panel.getVisibility() == View.VISIBLE ? View.GONE : View.VISIBLE);
                      }
                  });
                  bubble.setAlpha(0.55f);

                  panel.addView(menuButton("1. Pick item (then tap it)", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          panel.setVisibility(View.GONE);
                          runJs("window.__cap.pick()");
                      }
                  }));
                  panel.addView(menuButton("2. Dump visible UI (in 5 s)", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          panel.setVisibility(View.GONE);
                          Toast.makeText(MainActivity.this,
                                  "Capturing in 5 seconds - show the screen you want", Toast.LENGTH_LONG).show();
                          ui.postDelayed(new Runnable() {
                              @Override
                              public void run() {
                                  runJs("window.__cap.dumpUi()");
                              }
                          }, 5000);
                      }
                  }));
                  panel.addView(menuButton("3. Save complete page JS", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          panel.setVisibility(View.GONE);
                          runJs("window.__cap.dumpJs()");
                      }
                  }));
                  panel.addView(menuButton("4. Save HTML + CSS", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          panel.setVisibility(View.GONE);
                          runJs("window.__cap.dumpDom()");
                      }
                  }));
                  panel.addView(menuButton("5. Share last capture", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          panel.setVisibility(View.GONE);
                          shareFile(lastCapture);
                      }
                  }));

                  box.addView(bubble);
                  box.addView(panel);

                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.END);
                  lp.setMargins(0, dp(8), dp(8), 0);
                  root.addView(box, lp);
              }

              /** Receives capture text from inspector.js in chunks, then saves + shares it. */
              private class CapBridge {
                  private final StringBuilder buf = new StringBuilder();

                  @JavascriptInterface
                  public synchronized void begin() {
                      buf.setLength(0);
                  }

                  @JavascriptInterface
                  public synchronized void chunk(String s) {
                      buf.append(s);
                  }

                  @JavascriptInterface
                  public void end(String name) {
                      final String text;
                      synchronized (this) {
                          text = buf.toString();
                          buf.setLength(0);
                      }
                      final String fileName = name.replaceAll("[^A-Za-z0-9._-]", "_");
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              saveCapture(fileName, text);
                          }
                      }).start();
                  }

                  @JavascriptInterface
                  public void toast(final String msg) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }

              private void saveCapture(String name, String text) {
                  try {
                      byte[] bytes = text.getBytes(StandardCharsets.UTF_8);
                      File base = getExternalFilesDir(null);
                      if (base == null) base = getFilesDir();
                      File dir = new File(base, "captures");
                      dir.mkdirs();
                      final File f = new File(dir, name);
                      try (FileOutputStream o = new FileOutputStream(f)) {
                          o.write(bytes);
                      }
                      lastCapture = f;
                      String where = f.getAbsolutePath();
                      if (copyToDownloads(name, bytes)) where = "Downloads/YTCapture/" + name;
                      final String msg = "Saved " + (bytes.length / 1024) + " KB: " + where;
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show();
                              shareFile(f);
                          }
                      });
                  } catch (final Exception e) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              Toast.makeText(MainActivity.this, "Save failed: " + e, Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }

              @SuppressLint("NewApi")
              private boolean copyToDownloads(String name, byte[] bytes) {
                  if (Build.VERSION.SDK_INT < 29) return false;
                  try {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                      v.put(MediaStore.Downloads.MIME_TYPE, "text/plain");
                      v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/YTCapture");
                      Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      if (u == null) return false;
                      try (OutputStream os = getContentResolver().openOutputStream(u)) {
                          if (os == null) return false;
                          os.write(bytes);
                      }
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void shareFile(File f) {
                  if (f == null || !f.exists()) {
                      Toast.makeText(this, "No capture saved yet", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  try {
                      Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType("text/plain");
                      i.putExtra(Intent.EXTRA_STREAM, uri);
                      i.putExtra(Intent.EXTRA_SUBJECT, f.getName());
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(i, "Send capture"));
                  } catch (Exception e) {
                      Toast.makeText(this, "Cannot share: " + e, Toast.LENGTH_LONG).show();
                  }
              }

              // ------------------------------------------------------------------

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      long now = System.currentTimeMillis();
                      if (now - lastBack < 700) {      // double-press Back = exit app
                          finish();
                          return true;
                      }
                      lastBack = now;
                      // YouTube TV expects Escape (keyCode 27) as "back".
                      web.dispatchKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ESCAPE));
                      web.dispatchKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ESCAPE));
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
                  web.resumeTimers();
              }

              @Override
              protected void onPause() {
                  CookieManager.getInstance().flush();
                  web.onPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      ((ViewGroup) web.getParent()).removeView(web);
                      web.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$GITHUB_WORKSPACE/_android/app/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set. Using a throwaway key: this APK cannot be installed over a previous build signed with a different key (uninstall first)."
            keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=YtAdBlockTv, O=Local, C=US"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=key" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle -p "$GITHUB_WORKSPACE/_android" assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp _android/app/build/outputs/apk/release/app-release.apk dist/YouTube-AdBlock-TV.apk
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-AdBlock-TV-apk
          path: dist/YouTube-AdBlock-TV.apk

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YouTube-AdBlock-TV.apk
