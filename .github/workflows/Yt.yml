                              }
                          }
                          if (best.getModeId() != cur.getModeId()) {
                              WindowManager.LayoutParams lp = getWindow().getAttributes();
                              lp.preferredDisplayModeId = best.getModeId();
                              getWindow().setAttributes(lp);
                          }
                      }
                  } catch (Exception ignored) { }
              }

              // ------------------------------------------------------------------
              // Animated splash (assets/splash.html) on top of the WebView while YouTube loads
              // ------------------------------------------------------------------
              @SuppressLint({"SetJavaScriptEnabled", "ClickableViewAccessibility"})
              private void showSplash() {
                  if (splash != null) return;
                  splashLeaving = false;
                  splashPageAt = 0;
                  splashStart = SystemClock.uptimeMillis();

                  splash = new WebView(this);
                  splash.setBackgroundColor(Color.BLACK);
                  splash.setFocusable(false);
                  splash.setFocusableInTouchMode(false);
                  splash.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  splash.setVerticalScrollBarEnabled(false);
                  splash.setHorizontalScrollBarEnabled(false);
                  splash.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          return true;                     // the splash swallows touches
                      }
                  });
                  WebSettings ss = splash.getSettings();
                  ss.setJavaScriptEnabled(true);
                  splash.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          return true;
                      }
                  });
                  root.addView(splash, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  splash.loadUrl("file:///android_asset/splash.html");

                  ui.removeCallbacks(splashCheck);
                  ui.postDelayed(splashCheck, SPLASH_MIN_MS);
              }

              private final Runnable splashCheck = new Runnable() {
                  @Override
                  public void run() {
                      if (splash == null || splashLeaving) return;
                      if (loadFailed || SystemClock.uptimeMillis() - splashStart >= SPLASH_MAX_MS) {
                          hideSplash(false);
                          return;
                      }
                      web.evaluateJavascript(READY_JS, new ValueCallback<String>() {
                          @Override
                          public void onReceiveValue(String v) {
                              if (splash == null || splashLeaving) return;
                              long t = SystemClock.uptimeMillis();
                              if ("2".equals(v)) {                       // page shown, YouTube's loader gone
                                  hideSplash(false);
                                  return;
                              }
                              if ("1".equals(v)) {                       // page shown, loader still in the DOM
                                  if (splashPageAt == 0) splashPageAt = t;
                                  else if (t - splashPageAt >= SPLASH_SETTLE_MS) {
                                      hideSplash(false);
                                      return;
                                  }
                              }
                              ui.postDelayed(splashCheck, 250);
                          }
                      });
                  }
              };

              private void hideSplash(boolean instant) {
                  if (splash == null) return;
                  if (instant) {
                      removeSplash();
                      return;
                  }
                  if (splashLeaving) return;
                  splashLeaving = true;
                  ui.removeCallbacks(splashCheck);
                  final WebView s = splash;
                  s.evaluateJavascript("window.splashOut&&window.splashOut()", null);   // 0.72 s zoom + blur out
                  ui.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (splash != s) return;
                          s.animate().alpha(0f).setDuration(160).withEndAction(new Runnable() {
                              @Override
                              public void run() {
                                  if (splash == s) removeSplash();
                              }
                          }).start();
                      }
                  }, 700);
              }

              private void removeSplash() {
                  ui.removeCallbacks(splashCheck);
                  WebView s = splash;
                  splash = null;
                  splashLeaving = false;
                  if (s == null) return;
                  try {
                      s.animate().cancel();
                      root.removeView(s);
                      s.stopLoading();
                      s.destroy();
                  } catch (Exception ignored) { }
                  if (offlineView.getVisibility() != View.VISIBLE) web.requestFocus();
              }

              // ------------------------------------------------------------------
              // No internet / load failed -> "Retry" page (instead of WebView's error page)
              // ------------------------------------------------------------------
              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              private void styleRetry(boolean focused) {
                  GradientDrawable g = new GradientDrawable();
                  g.setCornerRadius(dp(26));
                  g.setColor(focused ? 0xFFF1F1F1 : 0x33FFFFFF);
                  retryBtn.setBackground(g);
                  retryBtn.setTextColor(focused ? Color.BLACK : Color.WHITE);
              }

              private void buildOfflineView() {
                  offlineView = new LinearLayout(this);
                  offlineView.setOrientation(LinearLayout.VERTICAL);
                  offlineView.setGravity(Gravity.CENTER);
                  offlineView.setBackgroundColor(Color.BLACK);
                  offlineView.setClickable(true);          // swallow touches meant for the WebView
                  offlineView.setVisibility(View.GONE);

                  offlineTitle = new TextView(this);
                  offlineTitle.setText("No internet connection");
                  offlineTitle.setTextColor(Color.WHITE);
                  offlineTitle.setTextSize(22);
                  offlineTitle.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams tp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  tp.bottomMargin = dp(8);
                  offlineView.addView(offlineTitle, tp);

                  TextView msg = new TextView(this);
                  msg.setText("Check your connection and try again");
                  msg.setTextColor(0xFFEEEEEE);            // light white (was grey)
                  msg.setTextSize(14);
                  msg.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams mp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  mp.bottomMargin = dp(28);
                  offlineView.addView(msg, mp);

                  retryBtn = new TextView(this);
                  retryBtn.setText("Retry");
                  retryBtn.setTextSize(16);
                  retryBtn.setGravity(Gravity.CENTER);
                  retryBtn.setPadding(dp(40), dp(12), dp(40), dp(12));
                  retryBtn.setFocusable(true);
                  retryBtn.setFocusableInTouchMode(true);
                  retryBtn.setOnFocusChangeListener(new View.OnFocusChangeListener() {
                      @Override
                      public void onFocusChange(View v, boolean hasFocus) {
                          styleRetry(hasFocus);
                      }
                  });
                  retryBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          retry();
                      }
                  });
                  styleRetry(false);
                  offlineView.addView(retryBtn, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  root.addView(offlineView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              }

              private void showOffline(String url) {
                  failedUrl = url;
                  loadFailed = true;
                  hideSplash(true);
                  offlineTitle.setText(isOnline() ? "Couldn't load YouTube" : "No internet connection");
                  retryBtn.setText("Retry");
                  offlineView.setVisibility(View.VISIBLE);
                  offlineView.bringToFront();
                  web.clearFocus();
                  retryBtn.requestFocus();
              }

              private void hideOffline() {
                  if (offlineView.getVisibility() == View.VISIBLE) {
                      offlineView.setVisibility(View.GONE);
                      web.requestFocus();
                  }
              }

              private void retry() {
                  if (!isOnline()) {
                      retryBtn.setText("Still offline - Retry");
                      return;
                  }
                  retryBtn.setText("Retrying...");
                  loadFailed = false;
                  web.loadUrl(failedUrl != null && failedUrl.startsWith("http") ? failedUrl : START_URL);
              }

              @SuppressWarnings("deprecation")
              private boolean isOnline() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                      if (cm == null) return true;
                      if (Build.VERSION.SDK_INT >= 23) {
                          Network n = cm.getActiveNetwork();
                          if (n == null) return false;
                          NetworkCapabilities c = cm.getNetworkCapabilities(n);
                          return c != null && c.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET);
                      }
                      android.net.NetworkInfo ni = cm.getActiveNetworkInfo();
                      return ni != null && ni.isConnected();
                  } catch (Exception e) {
                      return true;
                  }
              }

              /** When the connection comes back while the Retry page is showing, reload automatically. */
              private void registerNetworkWatcher() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                      if (cm == null) return;
                      netCb = new ConnectivityManager.NetworkCallback() {
                          @Override
                          public void onAvailable(Network network) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (offlineView.getVisibility() == View.VISIBLE) retry();
                                  }
                              });
                          }
                      };
                      cm.registerNetworkCallback(new NetworkRequest.Builder()
                              .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET).build(), netCb);
                  } catch (Exception e) {
                      netCb = null;
                  }
              }

              private void runJs(String js) {
                  web.evaluateJavascript("try{" + js + "}catch(e){}", null);
              }

              private void openTools() {
                  runJs("window.__ytx&&window.__ytx.panel()");
              }

              // ------------------------------------------------------------------
              // On-screen remote: Back / Up / Down / Left / Right / OK / Tools, left edge of the screen
              // ------------------------------------------------------------------
              private void sendKey(int keyCode, boolean down) {
                  if (web == null) return;
                  if (offlineView.getVisibility() == View.VISIBLE) {      // Retry page
                      if (down && keyCode == KeyEvent.KEYCODE_ENTER) retry();
                      else if (down && keyCode == KeyEvent.KEYCODE_ESCAPE) finish();
                      return;
                  }
                  web.dispatchKeyEvent(new KeyEvent(
                          down ? KeyEvent.ACTION_DOWN : KeyEvent.ACTION_UP, keyCode));
              }

              private void stopRepeat() {
                  if (repeater != null) {
                      ui.removeCallbacks(repeater);
                      repeater = null;
                  }
              }

              private void startRepeat(final int keyCode) {
                  stopRepeat();
                  repeater = new Runnable() {
                      @Override
                      public void run() {
                          sendKey(keyCode, true);
                          ui.postDelayed(this, 110);
                      }
                  };
                  ui.postDelayed(repeater, 400);
              }

              private void styleRemote(TextView t, boolean pressed) {
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(pressed ? 0xCCF1F1F1 : 0x99202020);
                  g.setStroke(dp(1), 0x55FFFFFF);
                  t.setBackground(g);
                  t.setTextColor(pressed ? Color.BLACK : Color.WHITE);
              }

              /** keyCode = 0 -> the Tools button (opens the Speed / SponsorBlock / Quality panel). */
              @SuppressLint("ClickableViewAccessibility")
              private TextView remoteBtn(String label, final int keyCode, final boolean repeat) {
                  final TextView t = new TextView(this);
                  t.setText(label);
                  t.setTextSize(label.length() > 2 ? 10 : 16);
                  t.setGravity(Gravity.CENTER);
                  t.setFocusable(false);
                  styleRemote(t, false);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(42), dp(42));
                  lp.setMargins(dp(3), dp(3), dp(3), dp(3));
                  t.setLayoutParams(lp);
                  t.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          int a = e.getActionMasked();
                          if (a == MotionEvent.ACTION_DOWN) {
                              styleRemote(t, true);
                              if (keyCode != 0) {
                                  sendKey(keyCode, true);
                                  if (repeat) startRepeat(keyCode);
                              }
                          } else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                              styleRemote(t, false);
                              stopRepeat();
                              if (keyCode != 0) sendKey(keyCode, false);
                              else if (a == MotionEvent.ACTION_UP) openTools();
                          }
                          return true;
                      }
                  });
                  return t;
              }

              private void buildRemote() {
                  remoteBox = new LinearLayout(this);
                  remoteBox.setOrientation(LinearLayout.VERTICAL);
                  remoteBox.setGravity(Gravity.CENTER_HORIZONTAL);
                  remoteBox.setAlpha(0.75f);

                  remoteBox.addView(remoteBtn("BACK", KeyEvent.KEYCODE_ESCAPE, false));
                  remoteBox.addView(remoteBtn("▲", KeyEvent.KEYCODE_DPAD_UP, true));

                  LinearLayout mid = new LinearLayout(this);
                  mid.setOrientation(LinearLayout.HORIZONTAL);
                  mid.addView(remoteBtn("◀", KeyEvent.KEYCODE_DPAD_LEFT, true));
                  mid.addView(remoteBtn("OK", KeyEvent.KEYCODE_ENTER, false));
                  mid.addView(remoteBtn("▶", KeyEvent.KEYCODE_DPAD_RIGHT, true));
                  // WRAP_CONTENT is required: a vertical LinearLayout would otherwise squeeze this row to one
                  // button width and clip OK and Right.
                  remoteBox.addView(mid, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  remoteBox.addView(remoteBtn("▼", KeyEvent.KEYCODE_DPAD_DOWN, true));
                  remoteBox.addView(remoteBtn("⚙", 0, false));     // Tools panel

                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.START | Gravity.CENTER_VERTICAL);
                  lp.setMargins(dp(4), 0, 0, 0);
                  root.addView(remoteBox, lp);
              }

              /** Hides / shows the on-screen remote (used by "Turn off screen" so the screen is fully black). */
              private class AppBridge {
                  @JavascriptInterface
                  public void setUiVisible(final boolean visible) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (remoteBox != null) remoteBox.setVisibility(visible ? View.VISIBLE : View.GONE);
                          }
                      });
                  }
              }

              // ------------------------------------------------------------------

              // Menu key / yellow key on a TV remote opens the Tools panel (Speed, SponsorBlock, Quality, Smooth scrolling ...).
              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int k = event.getKeyCode();
                  if (k == KeyEvent.KEYCODE_MENU || k == KeyEvent.KEYCODE_PROG_YELLOW) {
                      if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0
                              && offlineView.getVisibility() != View.VISIBLE) {
                          openTools();
                      }
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      if (offlineView.getVisibility() == View.VISIBLE) {   // Retry page: Back = exit
                          finish();
                          return true;
                      }
                      long now = System.currentTimeMillis();
                      if (now - lastBack < 700) {      // double-press Back = exit app
                          finish();
                          return true;
                      }
                      lastBack = now;
                      // YouTube TV expects Escape (keyCode 27) as "back".
                      web.dispatchKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ESCAPE));
                      web.dispatchKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ESCAPE));
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
                  web.resumeTimers();
                  if (splash != null) splash.onResume();
              }

              @Override
              protected void onPause() {
                  CookieManager.getInstance().flush();
                  web.onPause();
                  if (splash != null) splash.onPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  ui.removeCallbacksAndMessages(null);
                  removeSplash();
                  try {
                      if (netCb != null) {
                          ((ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE))
                                  .unregisterNetworkCallback(netCb);
                      }
                  } catch (Exception ignored) { }
                  if (web != null) {
                      ((ViewGroup) web.getParent()).removeView(web);
                      web.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Fetch app logos
        run: |
          P="$GITHUB_WORKSPACE/_android"
          RES="$P/app/src/main/res"
          TMP="$(mktemp -d)"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          BANNER_URL="https://www.gstatic.com/youtube/img/promos/growth/YTP_logo_social_1200x630.png"
          ICON_URL="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png"

          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi
          IM="convert"
          if command -v magick >/dev/null 2>&1; then IM="magick"; fi

          BANNER_OK=0
          ICON_OK=0

          # Premium wordmark -> assets (used by the splash and served in place of the YouTube wordmark).
          # If this fails the app downloads it at runtime instead.
          WORDMARK_URL="https://www.gstatic.com/youtube/img/branding/livingroom/premium/wordmark_truncated/fullcolor_white_57_2x_v2.png"
          WM="$P/app/src/main/assets/wordmark_premium.png"
          if curl -fsSL --retry 3 --max-time 60 -A "$UA" -o "$WM" "$WORDMARK_URL" \
             && [ "$(head -c 4 "$WM" | od -An -tx1 | tr -d ' \n')" = "89504e47" ]; then
            echo "premium wordmark ok ($(stat -c %s "$WM") bytes)"
          else
            rm -f "$WM"
            echo "::warning::Could not fetch the Premium wordmark - the app will download it at runtime."
          fi

          # Landscape logo -> Android TV banner (640x360, padded with the image's own corner colour)
          if curl -fsSL --retry 3 --max-time 60 -A "$UA" -o "$TMP/banner_src.png" "$BANNER_URL"; then
            BG="$($IM "$TMP/banner_src.png" -format '%[pixel:p{4,4}]' info: 2>/dev/null || true)"
            case "$BG" in
              ""|none|*transparent*|srgba*,0\)|rgba*,0\)) BG="#0F0F0F" ;;
            esac
            if $IM "$TMP/banner_src.png" -background "$BG" -alpha remove -alpha off \
                 -resize 640x360 -gravity center -extent 640x360 "$RES/drawable-nodpi/banner.png"; then
              BANNER_OK=1
            fi
          fi

          # Square logo -> launcher icon (256x256 on white)
          if curl -fsSL --retry 3 --max-time 60 -A "$UA" -o "$TMP/icon_src.png" "$ICON_URL"; then
            if $IM "$TMP/icon_src.png" -background white -alpha remove -alpha off \
                 -resize 190x190 -gravity center -extent 256x256 "$RES/drawable-nodpi/ic_launcher.png"; then
              ICON_OK=1
            fi
          fi

          # Built-in fallbacks so the build never fails because of a download
          if [ "$ICON_OK" != "1" ]; then
            echo "::warning::Could not fetch/convert the square logo - using built-in icon."
            cat > "$RES/drawable/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp" android:height="96dp"
              android:viewportWidth="96" android:viewportHeight="96">
              <path android:fillColor="#FF0000" android:pathData="M0,0h96v96h-96z" />
              <path android:fillColor="#FFFFFF" android:pathData="M38,28L38,68L70,48z" />
          </vector>
          EOF
          fi

          if [ "$BANNER_OK" != "1" ]; then
            echo "::warning::Could not fetch/convert the landscape logo - using built-in banner."
            cat > "$RES/drawable/banner.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp"
              android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#0F0F0F" android:pathData="M0,0h320v180h-320z" />
              <path android:fillColor="#FF0000" android:pathData="M120,60h80a16,16 0 0 1 16,16v28a16,16 0 0 1 -16,16h-80a16,16 0 0 1 -16,-16v-28a16,16 0 0 1 16,-16z" />
              <path android:fillColor="#FFFFFF" android:pathData="M150,78L150,102L174,90z" />
          </vector>
          EOF
          fi

          echo "banner ok=$BANNER_OK icon ok=$ICON_OK"
          ls -l "$RES/drawable" "$RES/drawable-nodpi"

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$GITHUB_WORKSPACE/_android/app/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set. Using a throwaway key: this APK cannot be installed over a previous build signed with a different key (uninstall first)."
            keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=YtAdBlockTv, O=Local, C=US"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=key" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle -p "$GITHUB_WORKSPACE/_android" assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp _android/app/build/outputs/apk/release/app-release.apk dist/YouTube-AdBlock-TV.apk
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-AdBlock-TV-apk
          path: dist/YouTube-AdBlock-TV.apk

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YouTube-AdBlock-TV.apk
