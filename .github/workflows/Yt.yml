                  retryBtn.setText("Retry");
                  retryBtn.setTextSize(16);
                  retryBtn.setGravity(Gravity.CENTER);
                  retryBtn.setPadding(dp(40), dp(12), dp(40), dp(12));
                  retryBtn.setFocusable(true);
                  retryBtn.setFocusableInTouchMode(true);
                  retryBtn.setOnFocusChangeListener(new View.OnFocusChangeListener() {
                      @Override
                      public void onFocusChange(View v, boolean hasFocus) {
                          styleRetry(hasFocus);
                      }
                  });
                  retryBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          retry();
                      }
                  });
                  styleRetry(false);
                  offlineView.addView(retryBtn, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  root.addView(offlineView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              }

              private void showOffline(String url) {
                  failedUrl = url;
                  loadFailed = true;
                  hideSplash(true);
                  offlineTitle.setText(isOnline() ? "Couldn't load YouTube" : "No internet connection");
                  retryBtn.setText("Retry");
                  offlineView.setVisibility(View.VISIBLE);
                  offlineView.bringToFront();
                  if (capBox != null) capBox.bringToFront();
                  web.clearFocus();
                  retryBtn.requestFocus();
              }

              private void hideOffline() {
                  if (offlineView.getVisibility() == View.VISIBLE) {
                      offlineView.setVisibility(View.GONE);
                      web.requestFocus();
                  }
              }

              private void retry() {
                  if (!isOnline()) {
                      retryBtn.setText("Still offline - Retry");
                      return;
                  }
                  retryBtn.setText("Retrying...");
                  loadFailed = false;
                  web.loadUrl(failedUrl != null && failedUrl.startsWith("http") ? failedUrl : START_URL);
              }

              @SuppressWarnings("deprecation")
              private boolean isOnline() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                      if (cm == null) return true;
                      if (Build.VERSION.SDK_INT >= 23) {
                          Network n = cm.getActiveNetwork();
                          if (n == null) return false;
                          NetworkCapabilities c = cm.getNetworkCapabilities(n);
                          return c != null && c.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET);
                      }
                      android.net.NetworkInfo ni = cm.getActiveNetworkInfo();
                      return ni != null && ni.isConnected();
                  } catch (Exception e) {
                      return true;
                  }
              }

              /** When the connection comes back while the Retry page is showing, reload automatically. */
              private void registerNetworkWatcher() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                      if (cm == null) return;
                      netCb = new ConnectivityManager.NetworkCallback() {
                          @Override
                          public void onAvailable(Network network) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (offlineView.getVisibility() == View.VISIBLE) retry();
                                  }
                              });
                          }
                      };
                      cm.registerNetworkCallback(new NetworkRequest.Builder()
                              .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET).build(), netCb);
                  } catch (Exception e) {
                      netCb = null;
                  }
              }

              // ------------------------------------------------------------------
              // TizenTube colour keys: sent to the page as the Tizen key codes TizenTube listens for
              // ------------------------------------------------------------------
              private void runJs(String js) {
                  web.evaluateJavascript("try{" + js + "}catch(e){window.YTCap&&YTCap.toast('Error: '+e)}", null);
              }

              private void sendTizenKey(int code) {
                  web.evaluateJavascript("(function(k){function f(t){var e;"
                          + "try{e=new KeyboardEvent(t,{bubbles:true,cancelable:true});}"
                          + "catch(x){e=document.createEvent('Event');e.initEvent(t,true,true);}"
                          + "try{Object.defineProperty(e,'keyCode',{get:function(){return k}});"
                          + "Object.defineProperty(e,'which',{get:function(){return k}});}catch(x){}"
                          + "(document.activeElement||document.body||document).dispatchEvent(e);}"
                          + "f('keydown');f('keyup');})(" + code + ")", null);
              }

              // ------------------------------------------------------------------
