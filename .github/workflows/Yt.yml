name: Build YouTube AdBlock TV APK

# Self-contained: no other files needed in the repo.
# Generates a small Android TV app (WebView -> youtube.com/tv, original YouTube UI) and injects:
#   0. quality.js - lifts the "one step lower" quality-menu cap (see comments inside)
#   1. adblock.js - ad-data stripper (technique from TizenTube's ad blocker, GPL-3.0)
#   2. glass.js   - transparent-blur player controls (now applied INSTANTLY when the player controls appear:
#                   new / changed nodes are glassed synchronously in the mutation callback, before the next paint),
#                   duration badges on thumbnails get the glass too,
#                   no black boxes behind card titles / subtitles / separator dots on EVERY screen
#                   (home, player, music, search ...),
#                   7-dot circular loading spinner instead of "Loading...",
#                   sign-in / welcome page background pictures forced back on,
#                   soft black gradient behind the player controls (like the original app)
#   3. ytx.js     - ported from TizenTube: playback speed (native-looking picker opened from the
#                   Settings > Speed row), SponsorBlock auto-skip, "Turn off screen" + auto-dim, tools panel.
#                   Settings rows:  Speed (shows current speed) / SponsorBlock On-Off (own shield icon)
#                                   / Turn off screen (eye icon) - icons are drawn as an overlay
#                                   with the row's own grey, covering the original icon
#                   Touch fix: taps on our menus never reach the YouTube panel underneath.
#   Also: on-screen remote (Up / Down / Left / Right / OK / Back) on the left edge, for tablets
#         (set SHOW_REMOTE=false in MainActivity.java to remove it).
#   4. inspector.js - CAP capture tool (set DEBUG_TOOLS=false in MainActivity.java to remove it)
#         CAP menu option 1 = "SVG + image URLs log": every <svg> (markup, rect, parents, colours),
#         every image URL (img, svg <image>, CSS background / mask / ::before / ::after, stylesheet url(),
#         resource list) and icon-font glyphs. Send that file back and the icons can be replaced.
# Also: ONE fixed User-Agent (Tizen 6.5 TV), black screen while video loads, "No internet - Retry" page,
# app logos downloaded at build time (falls back to a built-in red icon if a download fails).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate Android project
        run: |
          P="$GITHUB_WORKSPACE/_android"
          J="$P/app/src/main/java/com/local/ytadblock/tv"
          mkdir -p "$J" "$P/app/src/main/assets" "$P/app/src/main/res/drawable" "$P/app/src/main/res/drawable-nodpi" "$P/app/src/main/res/xml"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YtAdBlockTv"
          include ':app'
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.local.ytadblock.tv'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.local.ytadblock.tv'
                  minSdk 21
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "1")
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
                      keyAlias System.getenv("KEY_ALIAS") ?: "key"
                      keyPassword System.getenv("KEY_PASSWORD") ?: "android"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="YouTube AdBlock"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation|uiMode|screenLayout|smallestScreenSize|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Lets the capture tool share saved files through the Android share sheet -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.local.ytadblock.tv.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # ---- Script 0: quality-menu cap fix ----
          # YouTube TV limits the Quality list by the display height it reads from the page
          # (innerHeight x devicePixelRatio, rounded DOWN to a standard step). System bars / window
          # insets make that number a little smaller than the real panel, so 1080p -> 720p max and
          # 4K -> 1440p max, while "Auto" (bandwidth based) still plays the higher one.
          # Here devicePixelRatio is reported slightly higher so the number lands on the real step.
          # Manual override: Tools panel -> "Unlock max quality" (auto / 1080p / 1440p / 4K / 8K).
          cat > "$P/app/src/main/assets/quality.js" <<'EOF'
          (function () {
            if (window.__ytq) return;
            window.__ytq = true;
            try {
              var d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio');
              if (!d || !d.get) return;
              var realGet = d.get;
              window.__realDpr = function () { return realGet.call(window); };
              var STEPS = [144, 240, 360, 480, 720, 1080, 1440, 2160, 4320];

              function forced() {
                try { return parseInt(localStorage.getItem('ytx-qmax') || '0', 10) || 0; } catch (e) { return 0; }
              }

              Object.defineProperty(window, 'devicePixelRatio', {
                configurable: true,
                enumerable: d.enumerable,
                get: function () {
                  var r = realGet.call(window);
                  try {
                    var ih = window.innerHeight;
                    if (!ih) return r;
                    var target = forced();
                    if (!target) {
                      var sc = window.screen || {};
                      var sh = Math.min(sc.width || 0, sc.height || 0);   // display height in CSS px
                      var phys = Math.max(ih, sh) * r;                    // physical pixels
                      for (var i = 0; i < STEPS.length; i++) {
                        if (phys <= STEPS[i] * 1.06) { target = STEPS[i]; break; }
                      }
                      if (!target) target = STEPS[STEPS.length - 1];
                    }
                    var f = target / ih;
                    if (f > r && f < r * 8) return f;
                  } catch (e) { }
                  return r;
                }
              });
            } catch (e) { }
          })();
          EOF

          # ---- Script 1: strips ad data from YouTube responses ----
          cat > "$P/app/src/main/assets/adblock.js" <<'EOF'
          (function () {
            if (window.__ytAdBlockMin) return;
            window.__ytAdBlockMin = true;

            function prune(r) {
              try {
                if (!r || typeof r !== 'object' || Array.isArray(r)) return r;

                if (r.adPlacements) r.adPlacements = [];
                if (r.playerAds) r.playerAds = false;
                if (r.adSlots) r.adSlots = [];

                var shelves = r.contents && r.contents.tvBrowseRenderer &&
                  r.contents.tvBrowseRenderer.content &&
                  r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer &&
                  r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer.content &&
                  r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer.content.sectionListRenderer &&
                  r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer.content.sectionListRenderer.contents;
                if (Array.isArray(shelves)) {
                  var list = r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer.content.sectionListRenderer;
                  list.contents = shelves.filter(function (s) { return !s.adSlotRenderer; });
                  list.contents.forEach(function (s) {
                    var h = s.shelfRenderer && s.shelfRenderer.content &&
                      s.shelfRenderer.content.horizontalListRenderer;
                    if (h && Array.isArray(h.items)) {
                      h.items = h.items.filter(function (i) { return !i.adSlotRenderer; });
                    }
                  });
                }

                if (Array.isArray(r.entries)) {
                  r.entries = r.entries.filter(function (e) {
                    return !(e && e.command && e.command.reelWatchEndpoint &&
                      e.command.reelWatchEndpoint.adClientParams &&
                      e.command.reelWatchEndpoint.adClientParams.isAd);
                  });
                }
              } catch (e) { /* never break the page */ }
              return r;
            }

            var origParse = JSON.parse;
            JSON.parse = function () {
              return prune(origParse.apply(this, arguments));
            };

            if (window.Response && Response.prototype.json) {
              var origJson = Response.prototype.json;
              Response.prototype.json = function () {
                return origJson.apply(this, arguments).then(prune);
              };
            }

            var origStringify = JSON.stringify;
            JSON.stringify = function (value, replacer, space) {
              try {
                var ctx = value && value.playbackContext && value.playbackContext.contentPlaybackContext;
                if (ctx && !ctx.isInlinePlaybackNoAd) {
                  var copy = origParse(origStringify(value));
                  copy.playbackContext.contentPlaybackContext.isInlinePlaybackNoAd = true;
                  return origStringify.call(this, copy, replacer, space);
                }
              } catch (e) { /* fall through */ }
              return origStringify.call(this, value, replacer, space);
            };

            // YouTube TV keeps its own JSON reference in window._yttv; point it at ours.
            window.addEventListener('load', function () {
              try {
                var y = window._yttv;
                if (y) for (var k in y) {
                  if (y[k] && y[k].JSON && y[k].JSON.parse) y[k].JSON.parse = JSON.parse;
                }
              } catch (e) { }
            });
          })();
          EOF

          # ---- Script 2: transparent-blur player controls + 7-dot loading spinner + welcome backgrounds ----
          # Class names on YouTube TV are obfuscated, so glass.js reads the real colour of small
          # elements on the watch page and tags them (dark pill -> light transparent blur,
          # white -> soft white). Menus / side panels (Settings) are left untouched. No shadows anywhere.
          #
          # TIMING FIX: the old version ran the (heavy) full scan at most every 60 ms, so when the player controls
          # appeared the first frames were un-glassed. Now the MutationObserver callback glasses the nodes that
          # were just added / changed RIGHT AWAY (synchronously, before the next paint), the full scan only
          # cleans up afterwards, and every key press / touch on the player triggers a short burst of scans.
          #
          # Card titles / subtitles (yt-formatted-string) never get a box behind them, on every screen.
          cat > "$P/app/src/main/assets/glass.js" <<'EOF'
          (function () {
            if (window.__ytGlass) return;
            window.__ytGlass = true;

            var BG_IMMERSIVE = 'https://www.gstatic.com/ytlr/img/ftux_immersive_1280x720_v2.jpg';
            var BG_GRADIENT = 'https://www.gstatic.com/ytlr/img/uni_tube_gradient_1280x720.jpg';

            var CSS = [
              /* card titles / subtitles / separator dots: NO box behind them - every screen (home, player, music ...) */
              'yt-formatted-string,yt-core-attributed-string{',
              '  background:transparent !important;background-color:transparent !important;}',
              'yt-formatted-string::before,yt-formatted-string::after,',
              'yt-core-attributed-string::before,yt-core-attributed-string::after,',
              '[idomkey^="detail-text"],[idomkey^="detail-text"] *,',
              '[idomkey^="detail-text"]::before,[idomkey^="detail-text"]::after,',
              '[idomkey^="detail-text"] *::before,[idomkey^="detail-text"] *::after{',
              '  background:transparent !important;background-color:transparent !important;box-shadow:none !important;',
              '  text-shadow:none !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;}',

              /* text spans on the watch page */
              'body.WEB_PAGE_TYPE_WATCH span[idomkey]{',
              '  background:transparent !important;background-color:transparent !important;}',
              'body.WEB_PAGE_TYPE_WATCH span[idomkey]::before,body.WEB_PAGE_TYPE_WATCH span[idomkey]::after{',
              '  background:transparent !important;background-color:transparent !important;box-shadow:none !important;}',

              /* video area is always plain black (no grey poster) */
              'video{background-color:#000 !important;}',

              /* soft black gradient from the seek bar down to the bottom while the player controls are shown */
              '#ytg-scrim{position:absolute;left:0;right:0;bottom:0;height:0;pointer-events:none;z-index:2;opacity:0;',
              '  transition:opacity .3s;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.28) 50%,rgba(0,0,0,.62));}',

              /* sign-in / welcome pages keep their background pictures */
              'html body ytlr-welcome-immersive-value-prop[class]{',
              '  background-image:url(' + BG_IMMERSIVE + ') !important;background-size:cover !important;',
              '  background-position:center !important;background-repeat:no-repeat !important;}',
              'html body ytlr-welcome[class]{',
              '  background-image:url(' + BG_GRADIENT + ') !important;background-size:cover !important;',
              '  background-position:center !important;background-repeat:no-repeat !important;}',

              /* transparent glass: low opacity, low blur, no shadow */
              'html:not([data-ytg-probe]) [data-ytg="dark"]{',
              '  background:rgba(255,255,255,.09) !important;',
              '  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}',
              'html:not([data-ytg-probe]) [data-ytg="mid"]{',
              '  background:rgba(255,255,255,.20) !important;',
              '  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}',
              'html:not([data-ytg-probe]) [data-ytg="light"]{',
              '  background:rgba(255,255,255,.88) !important;}',
              /* thin parts (seek bar track / buffered / played) */
              'html:not([data-ytg-probe]) [data-ytg="tdark"]{background:rgba(255,255,255,.22) !important;}',
              'html:not([data-ytg-probe]) [data-ytg="tmid"]{background:rgba(255,255,255,.36) !important;}',
              'html:not([data-ytg-probe]) [data-ytg="tlight"]{background:rgba(255,255,255,.95) !important;}',

              /* "Loading..." text hidden; 7-dot spinner drawn instead */
              '[data-ytg-loadtext]{color:transparent !important;-webkit-text-fill-color:transparent !important;text-shadow:none !important;}',
              '[data-ytg-hide]{visibility:hidden !important;}',
              '#ytg-spin{position:fixed;width:60px;height:60px;z-index:2147483647;pointer-events:none;display:none;}',
              '#ytg-spin i{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;',
              '  border-radius:50%;background:#fff;opacity:.15;animation:ytg-fade 1.05s linear infinite;}',
              '@keyframes ytg-fade{0%{opacity:1}100%{opacity:.15}}'
            ].join('\n');

            var style = null;
            function inject() {
              if (style && style.isConnected) return;
              if (!style) { style = document.createElement('style'); style.id = 'yt-glass-css'; }
              style.textContent = CSS;
              (document.head || document.documentElement).appendChild(style);
            }

            function isWatch() {
              return !!document.body && /WEB_PAGE_TYPE_WATCH/.test(document.body.className);
            }

            function parse(c) {
              var m = c && c.match(/rgba?\(([^)]+)\)/);
              if (!m) return null;
              var p = m[1].split(',').map(parseFloat);
              return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
            }

            function mark(el, state) {
              if (state) {
                if (el.getAttribute('data-ytg') !== state) el.setAttribute('data-ytg', state);
              } else if (el.hasAttribute('data-ytg')) {
                el.removeAttribute('data-ytg');
              }
            }

            // formatted strings / SVG are never glassed. SPAN is NOT skipped any more: the duration badge
            // on thumbnails ("2:06:42") is a dark <span> and must get the glass like the other badges.
            var SKIP = { VIDEO: 1, IMG: 1, IMAGE: 1, 'YTLR-PLAYER': 1, SCRIPT: 1, STYLE: 1,
              'YT-FORMATTED-STRING': 1, 'YT-CORE-ATTRIBUTED-STRING': 1, SVG: 1, PATH: 1 };

            function skipped(el) {
              if (SKIP[el.tagName.toUpperCase()]) return true;
              // title / channel / views / time row: never gets glass (no box behind the dots)
              if (el.closest && el.closest('[idomkey^="detail-text"]')) return true;
              return false;
            }

            // Anything inside a menu / dialog (the panel that opens from Settings) is left untouched.
            var MENU_TAG = /menu|dialog|popup|modal|dropdown/i;
            var MENU_ROLE = /^(menu|menubar|dialog|alertdialog|listbox)$/i;
            function inMenu(el) {
              for (var n = 0, p = el; p && p.nodeType === 1 && n < 12; p = p.parentElement, n++) {
                if (MENU_TAG.test(p.tagName) || MENU_ROLE.test(p.getAttribute('role') || '') ||
                    p.getAttribute('aria-modal') === 'true') return true;
              }
              return false;
            }
            function inAny(rects, x, y) {
              for (var i = 0; i < rects.length; i++) {
                var r = rects[i];
                if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true;
              }
              return false;
            }

            // ---------- sign-in / welcome pages: put the background pictures back ----------
            var BGS = [
              ['ytlr-welcome-immersive-value-prop', BG_IMMERSIVE],
              ['ytlr-welcome', BG_GRADIENT]
            ];
            function bgPass() {
              for (var b = 0; b < BGS.length; b++) {
                var list = document.getElementsByTagName(BGS[b][0]);
                var file = BGS[b][1].substring(BGS[b][1].lastIndexOf('/') + 1);
                for (var i = 0; i < list.length; i++) {
                  var el = list[i];
                  if ((el.style.backgroundImage || '').indexOf(file) < 0) {
                    el.style.setProperty('background-image', 'url("' + BGS[b][1] + '")', 'important');
                    el.style.setProperty('background-size', 'cover', 'important');
                    el.style.setProperty('background-position', 'center', 'important');
                    el.style.setProperty('background-repeat', 'no-repeat', 'important');
                  }
                }
              }
            }

            // ---------- decide the glass state of ONE element (glass rules must be switched off = probe) ----------
            function classify(el, r, W, H, panels) {
              if (r.width < 6 || r.height < 3 || r.right < 0 || r.bottom < 0 || r.left > W || r.top > H) return null;
              var thin = r.height <= 12;
              if (!thin && (r.height > 80 || r.width > 400)) return null;
              if (panels.length && inAny(panels, r.left + r.width / 2, r.top + r.height / 2)) return null;
              var cs = getComputedStyle(el);
              if (cs.visibility === 'hidden' || cs.display === 'none' ||
                  (cs.backgroundImage && cs.backgroundImage !== 'none')) return null;
              var bg = parse(cs.backgroundColor);
              if (!bg || bg.a < 0.05) return null;
              var lum = (0.299 * bg.r + 0.587 * bg.g + 0.114 * bg.b) / 255;
              var base = lum < 0.55 ? 'dark' : (bg.a < 0.6 ? 'mid' : 'light');
              var p = el.parentElement;
              if (!thin && base === 'dark' && p && p.getAttribute('data-ytg') === 'dark') return null;
              if (inMenu(el)) return null;
              return (thin ? 't' : '') + base;
            }

            var lastPanels = [];

            // ---------- full scan (watch page only) ----------
            // Glass rules are switched OFF while the real colours are read, then ON again in the
            // same task, so the screen never shows the un-glassed state.
            function pass() {
              if (document.hidden || !document.body || !isWatch()) return;
              var root = document.documentElement;
              var all = document.body.getElementsByTagName('*');
              var W = innerWidth, H = innerHeight;
              root.setAttribute('data-ytg-probe', '1');
              try {
                var els = [], rects = [], panels = [], i, el, r, cs;
                for (i = 0; i < all.length; i++) {
                  el = all[i];
                  if (skipped(el)) { mark(el, null); continue; }
                  r = el.getBoundingClientRect();
                  els.push(el); rects.push(r);
                  // tall side panel (Settings menu) -> nothing inside it gets glass
                  if (r.height >= H * 0.85 && r.width >= 180 && r.width <= W * 0.7 && r.right > 0 && r.left < W) {
                    cs = getComputedStyle(el);
                    var pb = parse(cs.backgroundColor);
                    if ((pb && pb.a > 0.05) || (cs.backgroundImage && cs.backgroundImage !== 'none')) panels.push(r);
                  }
                }
                lastPanels = panels;
                for (i = 0; i < els.length; i++) mark(els[i], classify(els[i], rects[i], W, H, panels));
              } finally {
                root.removeAttribute('data-ytg-probe');
              }
            }

            // ---------- FAST scan: only the nodes that were just added / changed ----------
            // Runs synchronously inside the MutationObserver callback, so new player controls are glassed
            // before the browser paints them. Reads first, writes after (no layout thrashing).
            function fastPass(recs) {
              if (document.hidden || !document.body || !isWatch()) return;
              var set = new Set(), targets = [], i, j, n, rec;
              for (i = 0; i < recs.length && targets.length < 60; i++) {
                rec = recs[i];
                if (rec.type === 'childList') {
                  for (j = 0; j < rec.addedNodes.length; j++) {
                    n = rec.addedNodes[j];
                    if (n.nodeType === 1) targets.push(n);
                  }
                } else if (rec.target && rec.target.nodeType === 1) {
                  targets.push(rec.target);
                }
              }
              if (!targets.length) return;
              var list = [], sub, k;
              for (i = 0; i < targets.length && list.length < 700; i++) {
                n = targets[i];
                if (!set.has(n)) { set.add(n); list.push(n); }
                sub = n.getElementsByTagName ? n.getElementsByTagName('*') : [];
                for (k = 0; k < sub.length && list.length < 700; k++) {
                  if (!set.has(sub[k])) { set.add(sub[k]); list.push(sub[k]); }
                }
              }
              var root = document.documentElement, W = innerWidth, H = innerHeight;
              var states = new Array(list.length), el, r;
              root.setAttribute('data-ytg-probe', '1');
              try {
                for (i = 0; i < list.length; i++) {
                  el = list[i];
                  if (!el.isConnected || skipped(el)) { states[i] = null; continue; }
                  r = el.getBoundingClientRect();
                  states[i] = classify(el, r, W, H, lastPanels);
                }
              } finally {
                root.removeAttribute('data-ytg-probe');
              }
