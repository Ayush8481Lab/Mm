                  } catch (Exception e) {
                      return null;
                  }
              }

              private String readAsset(String name) {
                  byte[] b = readAssetBytes(name);
                  return b == null ? "" : new String(b, StandardCharsets.UTF_8);
              }

              // ------------------------------------------------------------------
