              // ------------------------------------------------------------------
              // On-screen remote: Up / Down / Left / Right / OK / Back, left edge of the screen
              // ------------------------------------------------------------------
              private void sendKey(int keyCode, boolean down) {
                  if (web == null) return;
                  if (offlineView.getVisibility() == View.VISIBLE) {      // Retry page
                      if (down && keyCode == KeyEvent.KEYCODE_ENTER) retry();
                      else if (down && keyCode == KeyEvent.KEYCODE_ESCAPE) finish();
                      return;
                  }
                  web.dispatchKeyEvent(new KeyEvent(
                          down ? KeyEvent.ACTION_DOWN : KeyEvent.ACTION_UP, keyCode));
              }

              private void stopRepeat() {
                  if (repeater != null) {
                      ui.removeCallbacks(repeater);
                      repeater = null;
                  }
              }

              private void startRepeat(final int keyCode) {
                  stopRepeat();
                  repeater = new Runnable() {
                      @Override
                      public void run() {
                          sendKey(keyCode, true);
                          ui.postDelayed(this, 110);
                      }
                  };
                  ui.postDelayed(repeater, 400);
              }

              private void styleRemote(TextView t, boolean pressed) {
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(pressed ? 0xCCF1F1F1 : 0x99202020);
                  g.setStroke(dp(1), 0x55FFFFFF);
                  t.setBackground(g);
                  t.setTextColor(pressed ? Color.BLACK : Color.WHITE);
              }

              @SuppressLint("ClickableViewAccessibility")
              private TextView remoteBtn(String label, final int keyCode, final boolean repeat) {
                  final TextView t = new TextView(this);
                  t.setText(label);
                  t.setTextSize(label.length() > 2 ? 10 : 16);
                  t.setGravity(Gravity.CENTER);
                  t.setFocusable(false);
                  styleRemote(t, false);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(42), dp(42));
                  lp.setMargins(dp(3), dp(3), dp(3), dp(3));
                  t.setLayoutParams(lp);
                  t.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          int a = e.getActionMasked();
                          if (a == MotionEvent.ACTION_DOWN) {
                              styleRemote(t, true);
                              sendKey(keyCode, true);
                              if (repeat) startRepeat(keyCode);
                          } else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                              styleRemote(t, false);
                              stopRepeat();
                              sendKey(keyCode, false);
                          }
                          return true;
                      }
                  });
                  return t;
              }

              private void buildRemote() {
                  remoteBox = new LinearLayout(this);
                  remoteBox.setOrientation(LinearLayout.VERTICAL);
                  remoteBox.setGravity(Gravity.CENTER_HORIZONTAL);
                  remoteBox.setAlpha(0.75f);

                  remoteBox.addView(remoteBtn("BACK", KeyEvent.KEYCODE_ESCAPE, false));
                  remoteBox.addView(remoteBtn("\u25B2", KeyEvent.KEYCODE_DPAD_UP, true));

                  LinearLayout mid = new LinearLayout(this);
                  mid.setOrientation(LinearLayout.HORIZONTAL);
                  mid.addView(remoteBtn("\u25C0", KeyEvent.KEYCODE_DPAD_LEFT, true));
                  mid.addView(remoteBtn("OK", KeyEvent.KEYCODE_ENTER, false));
                  mid.addView(remoteBtn("\u25B6", KeyEvent.KEYCODE_DPAD_RIGHT, true));
                  // WRAP_CONTENT is required: a vertical LinearLayout would otherwise squeeze this row to one
                  // button width and clip OK and Right.
                  remoteBox.addView(mid, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  remoteBox.addView(remoteBtn("\u25BC", KeyEvent.KEYCODE_DPAD_DOWN, true));

                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.START | Gravity.CENTER_VERTICAL);
                  lp.setMargins(dp(4), 0, 0, 0);
                  root.addView(remoteBox, lp);
              }

              /** Receives capture text from inspector.js in chunks, then saves + shares it. */
              private class CapBridge {
                  private final StringBuilder buf = new StringBuilder();

                  @JavascriptInterface
                  public synchronized void begin() {
                      buf.setLength(0);
                  }

                  @JavascriptInterface
                  public synchronized void chunk(String s) {
                      buf.append(s);
                  }

                  @JavascriptInterface
                  public void end(String name) {
                      final String text;
                      synchronized (this) {
                          text = buf.toString();
                          buf.setLength(0);
                      }
                      final String fileName = name.replaceAll("[^A-Za-z0-9._-]", "_");
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              saveCapture(fileName, text);
                          }
                      }).start();
                  }

                  @JavascriptInterface
                  public void toast(final String msg) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show();
                          }
                      });
                  }

                  /** Hides / shows the CAP button (used by "Turn off screen" so the screen is fully black). */
                  @JavascriptInterface
                  public void setUiVisible(final boolean visible) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (capBox != null) capBox.setVisibility(visible ? View.VISIBLE : View.GONE);
                              if (remoteBox != null) remoteBox.setVisibility(visible ? View.VISIBLE : View.GONE);
                              if (!visible && panel != null) panel.setVisibility(View.GONE);
                          }
                      });
                  }
              }

              private void saveCapture(String name, String text) {
                  try {
                      byte[] bytes = text.getBytes(StandardCharsets.UTF_8);
                      File base = getExternalFilesDir(null);
                      if (base == null) base = getFilesDir();
                      File dir = new File(base, "captures");
                      dir.mkdirs();
                      final File f = new File(dir, name);
                      try (FileOutputStream o = new FileOutputStream(f)) {
                          o.write(bytes);
                      }
                      lastCapture = f;
                      String where = f.getAbsolutePath();
                      if (copyToDownloads(name, bytes)) where = "Downloads/YTCapture/" + name;
                      final String msg = "Saved " + (bytes.length / 1024) + " KB: " + where;
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show();
                              shareFile(f);
                          }
                      });
                  } catch (final Exception e) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              Toast.makeText(MainActivity.this, "Save failed: " + e, Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }

              @SuppressLint("NewApi")
              private boolean copyToDownloads(String name, byte[] bytes) {
                  if (Build.VERSION.SDK_INT < 29) return false;
                  try {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                      v.put(MediaStore.Downloads.MIME_TYPE, "text/plain");
                      v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/YTCapture");
                      Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      if (u == null) return false;
                      try (OutputStream os = getContentResolver().openOutputStream(u)) {
                          if (os == null) return false;
                          os.write(bytes);
                      }
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void shareFile(File f) {
                  if (f == null || !f.exists()) {
                      Toast.makeText(this, "No capture saved yet", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  try {
                      Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType("text/plain");
                      i.putExtra(Intent.EXTRA_STREAM, uri);
                      i.putExtra(Intent.EXTRA_SUBJECT, f.getName());
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(i, "Send capture"));
                  } catch (Exception e) {
                      Toast.makeText(this, "Cannot share: " + e, Toast.LENGTH_LONG).show();
                  }
              }

              // ------------------------------------------------------------------

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      if (offlineView.getVisibility() == View.VISIBLE) {   // Retry page: Back = exit
                          finish();
                          return true;
                      }
                      long now = System.currentTimeMillis();
                      if (now - lastBack < 700) {      // double-press Back = exit app
                          finish();
                          return true;
                      }
                      lastBack = now;
                      // YouTube TV expects Escape (keyCode 27) as "back".
                      web.dispatchKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ESCAPE));
                      web.dispatchKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ESCAPE));
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
                  web.resumeTimers();
              }

              @Override
              protected void onPause() {
                  CookieManager.getInstance().flush();
                  web.onPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  try {
                      if (netCb != null) {
                          ((ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE))
                                  .unregisterNetworkCallback(netCb);
                      }
                  } catch (Exception ignored) { }
                  if (web != null) {
                      ((ViewGroup) web.getParent()).removeView(web);
                      web.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Fetch app logos
        run: |
          P="$GITHUB_WORKSPACE/_android"
          RES="$P/app/src/main/res"
          TMP="$(mktemp -d)"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          BANNER_URL="https://www.gstatic.com/youtube/img/promos/growth/YTP_logo_social_1200x630.png"
          ICON_URL="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png"

          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi
          IM="convert"
          if command -v magick >/dev/null 2>&1; then IM="magick"; fi

          BANNER_OK=0
          ICON_OK=0

          # Landscape logo -> Android TV banner (640x360, padded with the image's own corner colour)
          if curl -fsSL --retry 3 --max-time 60 -A "$UA" -o "$TMP/banner_src.png" "$BANNER_URL"; then
            BG="$($IM "$TMP/banner_src.png" -format '%[pixel:p{4,4}]' info: 2>/dev/null || true)"
            case "$BG" in
              ""|none|*transparent*|srgba*,0\)|rgba*,0\)) BG="#0F0F0F" ;;
            esac
            if $IM "$TMP/banner_src.png" -background "$BG" -alpha remove -alpha off \
                 -resize 640x360 -gravity center -extent 640x360 "$RES/drawable-nodpi/banner.png"; then
              BANNER_OK=1
            fi
          fi

          # Square logo -> launcher icon (256x256 on white)
          if curl -fsSL --retry 3 --max-time 60 -A "$UA" -o "$TMP/icon_src.png" "$ICON_URL"; then
            if $IM "$TMP/icon_src.png" -background white -alpha remove -alpha off \
                 -resize 190x190 -gravity center -extent 256x256 "$RES/drawable-nodpi/ic_launcher.png"; then
              ICON_OK=1
            fi
          fi

          # Built-in fallbacks so the build never fails because of a download
          if [ "$ICON_OK" != "1" ]; then
            echo "::warning::Could not fetch/convert the square logo - using built-in icon."
            cat > "$RES/drawable/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp" android:height="96dp"
              android:viewportWidth="96" android:viewportHeight="96">
              <path android:fillColor="#FF0000" android:pathData="M0,0h96v96h-96z" />
              <path android:fillColor="#FFFFFF" android:pathData="M38,28L38,68L70,48z" />
          </vector>
          EOF
          fi

          if [ "$BANNER_OK" != "1" ]; then
            echo "::warning::Could not fetch/convert the landscape logo - using built-in banner."
            cat > "$RES/drawable/banner.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp"
              android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#0F0F0F" android:pathData="M0,0h320v180h-320z" />
              <path android:fillColor="#FF0000" android:pathData="M120,60h80a16,16 0 0 1 16,16v28a16,16 0 0 1 -16,16h-80a16,16 0 0 1 -16,-16v-28a16,16 0 0 1 16,-16z" />
              <path android:fillColor="#FFFFFF" android:pathData="M150,78L150,102L174,90z" />
          </vector>
          EOF
          fi

          echo "banner ok=$BANNER_OK icon ok=$ICON_OK"
          ls -l "$RES/drawable" "$RES/drawable-nodpi"

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$GITHUB_WORKSPACE/_android/app/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set. Using a throwaway key: this APK cannot be installed over a previous build signed with a different key (uninstall first)."
            keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=YtAdBlockTv, O=Local, C=US"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=key" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle -p "$GITHUB_WORKSPACE/_android" assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp _android/app/build/outputs/apk/release/app-release.apk dist/YouTube-AdBlock-TV.apk
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-AdBlock-TV-apk
          path: dist/YouTube-AdBlock-TV.apk

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YouTube-AdBlock-TV.apk
