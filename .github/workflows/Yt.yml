name: Build YouTube AdBlock TV APK

# Self-contained: no other files needed in the repo.
# Generates a small Android TV app (WebView -> youtube.com/tv, original YouTube UI) and injects:
#   0. quality.js - lifts the "one step lower" quality-menu cap (see comments inside)
#   1. smooth.js  - Android-style smooth scrolling: rows / lists glide on the Material "standard" curve
#                   (cubic-bezier(.2,0,0,1)), held D-pad = one continuous glide, off-screen rows never fly;
#                   also tells glass.js when the user is scrolling so heavy scans wait (no dropped frames).
#                   On / off: Tools panel -> "Smooth scrolling".
#   2. adblock.js - ad-data stripper (technique from TizenTube's ad blocker, GPL-3.0)
#   3. glass.js   - transparent-blur player controls (applied INSTANTLY when the player controls appear),
#                   duration badges on thumbnails get the glass too,
#                   no black boxes behind card titles / subtitles / separator dots on EVERY screen,
#                   grey text (subtitles, channel names, views, menu hints ...) shown in light white everywhere
#                   (text on a light / focused background keeps its dark colour),
#                   7-dot circular loading spinner instead of "Loading...",
#                   sign-in / welcome page background pictures forced back on,
#                   soft black gradient behind the player controls (like the original app),
#                   YouTube's base64 splash logo removed (the app shows its own animated splash)
#   4. ytx.js     - ported from TizenTube: playback speed (native-looking picker opened from the
#                   Settings > Speed row), SponsorBlock auto-skip, "Turn off screen" + auto-dim, tools panel.
#                   Settings rows:  Speed (shows current speed) / SponsorBlock On-Off (own shield icon)
#                                   / Turn off screen (eye icon)
#                   Up next: the card of the video that is playing now gets the animated equalizer
#                   (equalizer.webp) in its middle - still bars (equalizer-0.png) while paused.
#                   Touch fix: taps on our menus never reach the YouTube panel underneath.
#   Tools panel (Speed / SponsorBlock / Quality / Dim / Smooth scrolling): Menu or Yellow key on the remote,
#         or the gear button on the on-screen remote.
#   Also: on-screen remote (Back / Up / Down / Left / Right / OK / Tools) on the left edge, for tablets
#         (set SHOW_REMOTE=false in MainActivity.java to remove it).
#   Splash: assets/splash.html ("Powered by Ayush@8481") plays at start-up and on full reloads, and fades out
#         as soon as YouTube is ready underneath (set SHOW_SPLASH=false in MainActivity.java to remove it).
#   Wordmark: every white YouTube wordmark the page loads (e.g. .../youtube/wordmark/fullcolor_white_96px.png)
#         is answered with the Premium wordmark (premium/wordmark_truncated/fullcolor_white_57_2x_v2.png),
#         bundled into the APK at build time.
# Also: ONE fixed User-Agent (PlayStation 5 / SmartTV), black screen while video loads, "No internet - Retry"
# page, highest refresh rate on phones / tablets, app logos downloaded at build time
# (falls back to a built-in red icon if a download fails).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate Android project
        run: |
          P="$GITHUB_WORKSPACE/_android"
          J="$P/app/src/main/java/com/local/ytadblock/tv"
          mkdir -p "$J" "$P/app/src/main/assets" "$P/app/src/main/res/drawable" "$P/app/src/main/res/drawable-nodpi"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YtAdBlockTv"
          include ':app'
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.local.ytadblock.tv'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.local.ytadblock.tv'
                  minSdk 21
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "1")
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
                      keyAlias System.getenv("KEY_ALIAS") ?: "key"
                      keyPassword System.getenv("KEY_PASSWORD") ?: "android"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="YouTube AdBlock"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation|uiMode|screenLayout|smallestScreenSize|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          # ---- Script 0: quality-menu cap fix ----
          # YouTube TV limits the Quality list by the display height it reads from the page
          # (innerHeight x devicePixelRatio, rounded DOWN to a standard step). System bars / window
          # insets make that number a little smaller than the real panel, so 1080p -> 720p max and
          # 4K -> 1440p max, while "Auto" (bandwidth based) still plays the higher one.
          # Here devicePixelRatio is reported slightly higher so the number lands on the real step.
          # Manual override: Tools panel -> "Unlock max quality" (auto / 1080p / 1440p / 4K / 8K).
          cat > "$P/app/src/main/assets/quality.js" <<'EOF'
          (function () {
            if (window.__ytq) return;
            window.__ytq = true;
            try {
              var d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio');
              if (!d || !d.get) return;
              var realGet = d.get;
              window.__realDpr = function () { return realGet.call(window); };
              var STEPS = [144, 240, 360, 480, 720, 1080, 1440, 2160, 4320];

              function forced() {
                try { return parseInt(localStorage.getItem('ytx-qmax') || '0', 10) || 0; } catch (e) { return 0; }
              }

              Object.defineProperty(window, 'devicePixelRatio', {
                configurable: true,
                enumerable: d.enumerable,
                get: function () {
                  var r = realGet.call(window);
                  try {
                    var ih = window.innerHeight;
                    if (!ih) return r;
                    var target = forced();
                    if (!target) {
                      var sc = window.screen || {};
                      var sh = Math.min(sc.width || 0, sc.height || 0);   // display height in CSS px
                      var phys = Math.max(ih, sh) * r;                    // physical pixels
                      for (var i = 0; i < STEPS.length; i++) {
                        if (phys <= STEPS[i] * 1.06) { target = STEPS[i]; break; }
                      }
                      if (!target) target = STEPS[STEPS.length - 1];
                    }
                    var f = target / ih;
                    if (f > r && f < r * 8) return f;
                  } catch (e) { }
                  return r;
                }
              });
            } catch (e) { }
          })();
          EOF

          # ---- Script 1: strips ad data from YouTube responses ----
          cat > "$P/app/src/main/assets/adblock.js" <<'EOF'
          (function () {
            if (window.__ytAdBlockMin) return;
            window.__ytAdBlockMin = true;

            function prune(r) {
              try {
                if (!r || typeof r !== 'object' || Array.isArray(r)) return r;

                if (r.adPlacements) r.adPlacements = [];
                if (r.playerAds) r.playerAds = false;
                if (r.adSlots) r.adSlots = [];

                var shelves = r.contents && r.contents.tvBrowseRenderer &&
                  r.contents.tvBrowseRenderer.content &&
                  r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer &&
                  r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer.content &&
                  r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer.content.sectionListRenderer &&
                  r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer.content.sectionListRenderer.contents;
                if (Array.isArray(shelves)) {
                  var list = r.contents.tvBrowseRenderer.content.tvSurfaceContentRenderer.content.sectionListRenderer;
                  list.contents = shelves.filter(function (s) { return !s.adSlotRenderer; });
                  list.contents.forEach(function (s) {
                    var h = s.shelfRenderer && s.shelfRenderer.content &&
                      s.shelfRenderer.content.horizontalListRenderer;
                    if (h && Array.isArray(h.items)) {
                      h.items = h.items.filter(function (i) { return !i.adSlotRenderer; });
                    }
                  });
                }

                if (Array.isArray(r.entries)) {
                  r.entries = r.entries.filter(function (e) {
                    return !(e && e.command && e.command.reelWatchEndpoint &&
                      e.command.reelWatchEndpoint.adClientParams &&
                      e.command.reelWatchEndpoint.adClientParams.isAd);
                  });
                }
              } catch (e) { /* never break the page */ }
              return r;
            }

            var origParse = JSON.parse;
            JSON.parse = function () {
              return prune(origParse.apply(this, arguments));
            };

            if (window.Response && Response.prototype.json) {
              var origJson = Response.prototype.json;
              Response.prototype.json = function () {
                return origJson.apply(this, arguments).then(prune);
              };
            }

            var origStringify = JSON.stringify;
            JSON.stringify = function (value, replacer, space) {
              try {
                var ctx = value && value.playbackContext && value.playbackContext.contentPlaybackContext;
                if (ctx && !ctx.isInlinePlaybackNoAd) {
                  var copy = origParse(origStringify(value));
                  copy.playbackContext.contentPlaybackContext.isInlinePlaybackNoAd = true;
                  return origStringify.call(this, copy, replacer, space);
                }
              } catch (e) { /* fall through */ }
              return origStringify.call(this, value, replacer, space);
            };

            // YouTube TV keeps its own JSON reference in window._yttv; point it at ours.
            window.addEventListener('load', function () {
              try {
                var y = window._yttv;
                if (y) for (var k in y) {
                  if (y[k] && y[k].JSON && y[k].JSON.parse) y[k].JSON.parse = JSON.parse;
                }
              } catch (e) { }
            });
          })();
          EOF

          # ---- Script 1b: Android-style smooth scrolling (see header) ----
          cat > "$P/app/src/main/assets/smooth.js" <<'EOF'
          (function () {
            if (window.__ytSmooth) return;
            window.__ytSmooth = true;

            // ======================= shared "user is scrolling" signal =======================
            // glass.js waits with its heavy full-page scans while this is true, so every frame goes to the scroll.
            var busyUntil = 0;
            function busy(ms) { var t = performance.now() + ms; if (t > busyUntil) busyUntil = t; }
            window.__ytIsBusy = function () { return performance.now() < busyUntil; };
            var NAVK = { 33: 1, 34: 1, 37: 1, 38: 1, 39: 1, 40: 1 };
            window.addEventListener('keydown', function (e) { if (NAVK[e.keyCode]) busy(e.repeat ? 450 : 320); }, true);
            ['touchmove', 'wheel'].forEach(function (n) {
              window.addEventListener(n, function () { busy(300); }, { capture: true, passive: true });
            });

            var on = true;
            try { on = localStorage.getItem('ytx-smooth') !== '0'; } catch (e) { }
            window.__ytSmoothOn = on;
            if (!on) return;

            // ======================= Android-style easing for the moving rows / lists =======================
            // YouTube TV scrolls its rows and the vertical list by changing their inline transform.
            //  - a container that already animates its transform gets the Android "standard" curve
            //    (fast start, soft landing) instead of YouTube's own one          -> data-yts="ease"
            //  - a container that JUMPS (no transition) gets a short glide on the same curve -> data-yts="add"
            //    but ONLY while it holds the focused card: rows that YouTube recycles off-screen still jump,
            //    so nothing ever flies across the screen.
            // Held keys: CSS transitions re-target from wherever the row is, so a held D-pad gives one continuous glide.
            // The transform animation runs on the GPU compositor, not on the page thread.
            var EASE = 'cubic-bezier(.2,0,0,1)';
            var DUR = 240;
            var CSS = [
              'html{-webkit-tap-highlight-color:transparent;}',
              'html,body{overscroll-behavior:none;}',
              '[data-yts="ease"]{transition-timing-function:' + EASE + ' !important;}',
              '[data-yts="add"]{transition:transform ' + DUR + 'ms ' + EASE + ' !important;}'
            ].join('\n');

            var styleEl = null;
            function inject() {
              if (styleEl && styleEl.isConnected) return;
              if (!styleEl) { styleEl = document.createElement('style'); styleEl.id = 'yt-smooth-css'; styleEl.textContent = CSS; }
              (document.head || document.documentElement).appendChild(styleEl);
            }

            var info = new WeakMap(), count = 0, MAX = 48;
            var TR = /translate|matrix/i;

            function excluded(el) {
              var t = el.tagName;
              if (t === 'VIDEO' || t === 'YTLR-PLAYER' || t === 'HTML' || t === 'BODY') return true;
              if (/^(ytx|ytg)-/.test(el.id || '')) return true;
              // seek bar / playhead / our own menus must follow instantly
              if (el.closest && el.closest('ytlr-progress-bar,[idomkey="slider"],#ytx-modal,#ytg-spin')) return true;
              return false;
            }

            function classify(el) {
              if (excluded(el)) return 'x';
              var r = el.getBoundingClientRect();
              if (el.children.length < 2 || !(r.width >= innerWidth * 0.35 || r.height >= innerHeight * 0.35)) return null;
              if (count >= MAX) return 'x';
              var cs = getComputedStyle(el);
              var props = (cs.transitionProperty || '').split(','), durs = (cs.transitionDuration || '0s').split(',');
              count++;
              for (var i = 0; i < props.length; i++) {
                var p = props[i].trim(), d = parseFloat(durs[i % durs.length]) || 0;
                if ((p === 'transform' || p === '-webkit-transform' || p === 'all') && d > 0) return 'ease';
              }
              return 'add';
            }

            function handle(recs) {
              var focus, looked = false, seen = new Set(), i, el, st, m, want;
              for (i = 0; i < recs.length; i++) {
                el = recs[i].target;
                if (!el || el.nodeType !== 1 || seen.has(el)) continue;
                seen.add(el);
                st = el.style && el.style.transform;
                if (!st || !TR.test(st)) continue;
                m = info.get(el);
                if (!m) { m = { mode: null, tries: 0 }; info.set(el, m); }
                if (m.mode === null) {
                  var c = classify(el);
                  if (!c) { if (++m.tries >= 3) m.mode = 'x'; continue; }   // too small / not a list (yet)
                  m.mode = c;
                }
                if (m.mode === 'x') continue;
                want = m.mode;
                if (want === 'add') {
                  if (!looked) { focus = document.querySelector('.zylon-focus'); looked = true; }
                  if (!focus || !el.contains(focus)) want = null;           // off-screen recycle: let it jump
                }
                if (want) { if (el.getAttribute('data-yts') !== want) el.setAttribute('data-yts', want); }
                else if (el.hasAttribute('data-yts')) el.removeAttribute('data-yts');
              }
            }

            // The attribute is set inside the mutation callback = before the style recalculation of the same frame,
            // so the transition already applies to the move that triggered it.
            function start() {
              if (!document.body) { setTimeout(start, 50); return; }
              inject();
              try {
                new MutationObserver(function (recs) { try { handle(recs); } catch (e) { } })
                  .observe(document.body, { attributes: true, attributeFilter: ['style'], subtree: true });
              } catch (e) { }
            }
            start();
            setInterval(inject, 1000);
          })();
          EOF

          # ---- Splash page (shown natively on top of the WebView while YouTube loads) ----
          # The wordmark is the bundled assets/wordmark_premium.png (gstatic as fallback).
          cat > "$P/app/src/main/assets/splash.html" <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>YouTube Premium Splash</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
          <style>
          /* ============================================================
             BASE
             ============================================================ */
          *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
          html,body{height:100%}
          body{
            background:#000;
            overflow:hidden;
            color:#fff;
            user-select:none;
            -webkit-user-select:none;
            font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            -webkit-font-smoothing:antialiased;
            text-rendering:optimizeLegibility;
          }

          /* ============================================================
             STAGE
             ============================================================ */
          .stage{
            position:fixed; inset:0;
            overflow:hidden;
            isolation:isolate;
            will-change:opacity,transform;
          }
          /* started by the app (window.splashOut) once YouTube has loaded underneath */
          .stage.out{animation:stageOut .72s cubic-bezier(.7,0,.9,.3) both}
          @keyframes stageOut{
            0%  {opacity:1; transform:scale(1);    filter:blur(0)}
            100%{opacity:0; transform:scale(1.06); filter:blur(10px)}
          }

          /* ============================================================
             BACKGROUND — LAYER 1: base
             ============================================================ */
          .bg-base{
            position:absolute; inset:0;
            background:
              radial-gradient(ellipse 75% 55% at 50% 42%, #1a0010 0%, #0a0a14 48%, #000 100%);
            opacity:0;
            animation:fadeIn 1.6s ease .1s both;
          }

          /* ============================================================
             BACKGROUND — LAYER 2: perspective tech floor
             ============================================================ */
          .tech-floor{
            position:absolute;
            left:-50%; right:-50%;
            top:48%; bottom:-80%;
            background-image:
              linear-gradient(rgba(255,30,60,.22) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255,30,60,.22) 1px, transparent 1px);
            background-size:60px 60px;
            transform:perspective(320px) rotateX(64deg);
            transform-origin:center top;
            animation:
              fadeIn 1.4s ease .25s both,
              floorScroll 3.4s linear infinite;
            will-change:background-position;
            opacity:0;
          }
          @keyframes floorScroll{
            from{background-position:0 0}
            to  {background-position:0 -60px}
          }

          /* fade grid into horizon */
          .floor-fade{
            position:absolute;
            left:0; right:0; top:0;
            height:56%;
            background:linear-gradient(180deg,
              #08080e 0%,
              rgba(8,8,14,.85) 42%,
              transparent 100%);
            pointer-events:none;
            z-index:1;
          }

          /* red glow at horizon */
          .horizon-glow{
            position:absolute;
            left:0; right:0;
            top:46%;
            height:180px;
            background:radial-gradient(ellipse 55% 100% at 50% 0%,
              rgba(255,20,55,.45) 0%,
              rgba(255,20,55,.12) 45%,
              transparent 75%);
            pointer-events:none;
            z-index:1;
            opacity:0;
            animation:fadeIn 1.6s ease .4s both;
          }

          /* ============================================================
             BACKGROUND — LAYER 3: data streams (cheap vertical falls)
             ============================================================ */
          .data-lines{position:absolute; inset:0; pointer-events:none; z-index:2}
          .dl{
            position:absolute;
            width:1px;
            height:38%;
            top:-40%;
            background:linear-gradient(180deg, transparent, rgba(255,30,60,.7), transparent);
            animation:dataFall 5s linear infinite;
            will-change:top;
            opacity:0;
          }
          @keyframes dataFall{
            0%  {top:-40%; opacity:0}
            10% {opacity:.9}
            90% {opacity:.9}
            100%{top:100%; opacity:0}
          }

          /* ============================================================
             BACKGROUND — LAYER 4: floating nodes
             ============================================================ */
          .nodes{position:absolute; inset:0; pointer-events:none; z-index:2}
          .nd{
            position:absolute;
            width:4px; height:4px;
            border-radius:50%;
            background:#ff1e3c;
            box-shadow:
              0 0 8px #ff1e3c,
              0 0 18px rgba(255,30,60,.55);
            animation:nodeFloat 5s ease-in-out infinite;
            will-change:transform,opacity;
            opacity:0;
          }
          @keyframes nodeFloat{
            0%,100%{transform:translate3d(0,0,0); opacity:.55}
            50%    {transform:translate3d(12px,-18px,0); opacity:1}
          }

          /* ============================================================
             BACKGROUND — LAYER 5: canvas + scanlines + vignette
             ============================================================ */
          #fx{
            position:absolute; inset:0;
            width:100%; height:100%;
            pointer-events:none;
            z-index:3;
          }
          .scanlines{
            position:absolute; inset:0;
            z-index:4;
            pointer-events:none;
            background:repeating-linear-gradient(
              0deg,
              transparent 0px,
              transparent 2px,
              rgba(255,255,255,.014) 3px,
              transparent 4px
            );
            opacity:.75;
          }
          .vignette{
            position:absolute; inset:0;
            z-index:4;
            pointer-events:none;
            background:radial-gradient(circle at 50% 42%, transparent 26%, rgba(0,0,0,.94) 100%);
          }

          /* ============================================================
             SCREEN HUD CORNERS
             ============================================================ */
          .hud-corner{
            position:absolute;
            width:44px; height:44px;
            border-color:rgba(255,30,60,.32);
            border-style:solid;
            pointer-events:none;
            z-index:5;
            opacity:0;
            animation:fadeIn 1.6s ease .8s both;
          }
          .hud-tl{top:26px;    left:26px;    border-width:1px 0 0 1px}
          .hud-tr{top:26px;    right:26px;   border-width:1px 1px 0 0}
          .hud-bl{bottom:26px; left:26px;    border-width:0 0 1px 1px}
          .hud-br{bottom:26px; right:26px;   border-width:0 1px 1px 0}

          /* ============================================================
             CONTENT
             ============================================================ */
          .content{
            position:relative; z-index:6;
            height:100%;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            gap:clamp(34px, 5.2vmin, 92px);
            padding:0 5vw;
          }

          /* ============================================================
             LOGO AREA — white wordmark on dark
             ============================================================ */
          .logo-wrap{
            position:relative;
            width:clamp(420px, 68vw, 1500px);
            max-width:94vw;
            display:flex; flex-direction:column; align-items:center;
