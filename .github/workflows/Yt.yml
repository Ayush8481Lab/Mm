          <script>
          (function () {
            'use strict';

            const canvas = document.getElementById('fx');
            const ctx    = canvas.getContext('2d', { alpha: true, desynchronized: true });
            const stage  = document.getElementById('stage');

            let W = 0, H = 0, DPR = 1;
            let dust = [];
            let sparks = [];
            let rafId = 0;
            let timers = [];
            let leaving = false;

            /* ==========================================================
               PARTICLE ENGINE  (optimized: few particles, fillRect dust)
               ========================================================== */
            function makeDust(anywhere) {
              return {
                x: Math.random() * W,
                y: anywhere ? Math.random() * H : H + 20 * DPR,
                s: (Math.random() * 1.4 + 0.5) * DPR,
                vx: (Math.random() - 0.5) * 0.10 * DPR,
                vy: -(Math.random() * 0.22 + 0.05) * DPR,
                a: Math.random() * 0.4 + 0.08,
                tw: Math.random() * Math.PI * 2,
                ts: Math.random() * 0.03 + 0.008,
                c: Math.random() < 0.32 ? '255,70,110'
                  : Math.random() < 0.18 ? '175,135,255'
                  : '255,255,255'
              };
            }

            function buildDust() {
              dust = [];
              const n = Math.min(60, Math.round((window.innerWidth * window.innerHeight) / 32000));
              for (let i = 0; i < n; i++) dust.push(makeDust(true));
            }

            function resize() {
              DPR = Math.min(window.devicePixelRatio || 1, 1.5);
              W = canvas.width  = Math.floor(window.innerWidth  * DPR);
              H = canvas.height = Math.floor(window.innerHeight * DPR);
              canvas.style.width  = window.innerWidth  + 'px';
              canvas.style.height = window.innerHeight + 'px';
              buildDust();
            }

            function burst() {
              const cx = W / 2;
              const cy = H * 0.42;
              const n  = 120;
              for (let i = 0; i < n; i++) {
                const ang = Math.random() * Math.PI * 2;
                const sp  = (Math.random() * 6.5 + 2) * DPR * (Math.random() < 0.13 ? 1.8 : 1);
                sparks.push({
                  x: cx + Math.cos(ang) * 55 * DPR,
                  y: cy + Math.sin(ang) * 55 * DPR,
                  vx: Math.cos(ang) * sp,
                  vy: Math.sin(ang) * sp,
                  r: (Math.random() * 2 + 0.6) * DPR,
                  life: 1,
                  decay: Math.random() * 0.012 + 0.009,
                  c: Math.random() < 0.55 ? '255,60,100'
                    : Math.random() < 0.6  ? '255,255,255'
                    : '195,145,255'
                });
              }
            }

            function frame() {
              ctx.clearRect(0, 0, W, H);
              ctx.globalCompositeOperation = 'lighter';

              /* dust — fillRect is faster than arc */
              for (let i = 0; i < dust.length; i++) {
                const p = dust[i];
                p.x += p.vx;
                p.y += p.vy;
                p.tw += p.ts;

                if (p.y < -12 * DPR) { dust[i] = makeDust(false); continue; }
                if (p.x < -12 * DPR) p.x = W + 12 * DPR;
                if (p.x > W + 12 * DPR) p.x = -12 * DPR;

                const a = p.a * (0.55 + 0.45 * Math.sin(p.tw));
                ctx.fillStyle = 'rgba(' + p.c + ',' + a.toFixed(3) + ')';
                ctx.fillRect(p.x, p.y, p.s, p.s);
              }

              /* sparks */
              for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx;
                s.y += s.vy;
                s.vx *= 0.965;
                s.vy *= 0.965;
                s.life -= s.decay;

                if (s.life <= 0) { sparks.splice(i, 1); continue; }

                ctx.beginPath();
                ctx.fillStyle = 'rgba(' + s.c + ',' + (s.life * 0.9).toFixed(3) + ')';
                ctx.arc(s.x, s.y, Math.max(s.r * s.life, 0.2), 0, Math.PI * 2);
                ctx.fill();
              }

              ctx.globalCompositeOperation = 'source-over';
              rafId = requestAnimationFrame(frame);
            }

            function startLoop() {
              if (!rafId) rafId = requestAnimationFrame(frame);
            }
            function stopLoop() {
              if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
            }

            /* ==========================================================
               TIMELINE  (the app calls window.splashOut() when YouTube is ready)
               ========================================================== */
            function schedule() {
              timers.push(setTimeout(burst, 1480));
            }

            window.splashOut = function () {
              if (leaving) return;
              leaving = true;
              stage.classList.add('out');
              timers.push(setTimeout(stopLoop, 760));
            };

            /* ==========================================================
               BOOT
               ========================================================== */
            window.addEventListener('resize', resize);
            resize();
            startLoop();
            schedule();

            document.addEventListener('visibilitychange', () => {
              if (document.hidden) stopLoop();
              else if (!leaving) startLoop();
            });

          })();
          </script>
          </body>
          </html>
          EOF

          # ---- Script 2: transparent-blur player controls + 7-dot loading spinner + welcome backgrounds ----
          # Class names on YouTube TV are obfuscated, so glass.js reads the real colour of small
          # elements on the watch page and tags them (dark pill -> light transparent blur,
          # white -> soft white). Menus / side panels (Settings) are left untouched. No shadows anywhere.
          #
          # TIMING FIX: the old version ran the (heavy) full scan at most every 60 ms, so when the player controls
          # appeared the first frames were un-glassed. Now the MutationObserver callback glasses the nodes that
          # were just added / changed RIGHT AWAY (synchronously, before the next paint), the full scan only
          # cleans up afterwards, and every key press / touch on the player triggers a short burst of scans.
          #
          # Card titles / subtitles (yt-formatted-string) never get a box behind them, on every screen.
          #
          # Grey text -> light white (TEXT_LIGHT): real colours are read with the rule switched off, and re-read
          # whenever focus moves, so text on a light (focused) background never turns white-on-white.
          # Scroll fix: style changes that only move a row (transform) are ignored by the observers.
          cat > "$P/app/src/main/assets/glass.js" <<'EOF'
          (function () {
            if (window.__ytGlass) return;
            window.__ytGlass = true;

            var BG_IMMERSIVE = 'https://www.gstatic.com/ytlr/img/ftux_immersive_1280x720_v2.jpg';
            var BG_GRADIENT = 'https://www.gstatic.com/ytlr/img/uni_tube_gradient_1280x720.jpg';

            // Grey text (subtitles, channel names, views, times, menu hints ...) is shown in this light white instead.
            var TEXT_LIGHT = '#eeeeee';

            var CSS = [
              /* card titles / subtitles / separator dots: NO box behind them - every screen (home, player, music ...) */
              'yt-formatted-string,yt-core-attributed-string{',
              '  background:transparent !important;background-color:transparent !important;}',
              'yt-formatted-string::before,yt-formatted-string::after,',
              'yt-core-attributed-string::before,yt-core-attributed-string::after,',
              '[idomkey^="detail-text"],[idomkey^="detail-text"] *,',
              '[idomkey^="detail-text"]::before,[idomkey^="detail-text"]::after,',
              '[idomkey^="detail-text"] *::before,[idomkey^="detail-text"] *::after{',
              '  background:transparent !important;background-color:transparent !important;box-shadow:none !important;',
              '  text-shadow:none !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;}',

              /* text spans on the watch page */
              'body.WEB_PAGE_TYPE_WATCH span[idomkey]{',
              '  background:transparent !important;background-color:transparent !important;}',
              'body.WEB_PAGE_TYPE_WATCH span[idomkey]::before,body.WEB_PAGE_TYPE_WATCH span[idomkey]::after{',
              '  background:transparent !important;background-color:transparent !important;box-shadow:none !important;}',

              /* video area is always plain black (no grey poster) */
              'video{background-color:#000 !important;}',

              /* YouTube's own base64 splash logo is gone - the app shows its own animated splash instead */
              '#loader,.splash-screen-loader{background-image:none !important;}',

              /* the YouTube wordmark is served as the Premium wordmark (MainActivity) - keep its proportions */
              'img[src*="/wordmark/fullcolor_white"]{object-fit:contain !important;}',
              '.t6OPnf{background-size:contain !important;background-repeat:no-repeat !important;',
              '  background-position:left center !important;}',

              /* grey text -> light white (switched off while the real colours are read = probe) */
              'html:not([data-ytl-probe]) [data-ytl]{color:' + TEXT_LIGHT + ' !important;}',

