                  float vw = splashView.getWidth(), vh = splashView.getHeight();
                  if (vw <= 0 || vh <= 0) return;
                  float scale = Math.min(vw / splashVideoW, vh / splashVideoH);
                  Matrix m = new Matrix();
                  m.setScale(splashVideoW * scale / vw, splashVideoH * scale / vh, vw / 2f, vh / 2f);
                  splashView.setTransform(m);
              }

