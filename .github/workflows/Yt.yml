                  ui.removeCallbacks(splashCheck);
                  ui.removeCallbacks(splashSafety);
                  final FrameLayout box = splashBox;
                  box.animate().alpha(0f).setDuration(280).withEndAction(new Runnable() {
                      @Override
                      public void run() {
                          if (splashBox == box) removeSplash();
                      }
                  }).start();
              }

              private void removeSplash() {
                  ui.removeCallbacks(splashCheck);
                  ui.removeCallbacks(splashSafety);
                  FrameLayout box = splashBox;
                  splashBox = null;
                  splashLeaving = false;
                  if (splashPlayer != null) {
                      try { splashPlayer.release(); } catch (Exception ignored) { }
                      splashPlayer = null;
                  }
                  if (splashSurface != null) {
                      try { splashSurface.release(); } catch (Exception ignored) { }
                      splashSurface = null;
                  }
                  splashView = null;
                  if (box != null) {
                      try {
                          box.animate().cancel();
                          root.removeView(box);
                      } catch (Exception ignored) { }
                  }
                  if (offlineView.getVisibility() != View.VISIBLE) web.requestFocus();
