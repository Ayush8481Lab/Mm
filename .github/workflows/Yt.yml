                      b = readAssetBytes("wordmark_premium.png");
                      if ((b == null || b.length < 100) && SystemClock.uptimeMillis() - wordmarkFailAt > 30000) {
                          b = download(WORDMARK_URL);
                          if (b == null || b.length < 100) wordmarkFailAt = SystemClock.uptimeMillis();
                      }
                      if (b != null && b.length >= 100) wordmark = b;
                      return wordmark;
                  }
