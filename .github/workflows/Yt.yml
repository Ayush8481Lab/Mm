name: Download YouTube Video (480p)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube video URL"
        required: true
        default: "https://youtu.be/NQJK_uZQlXw"
      max_height:
        description: "Max video height (480 = 480p)"
        required: false
        default: "480"
      runner:
        description: "Where to run (self-hosted uses your own IP and avoids most bot checks)"
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

jobs:
  download:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deno is the JS runtime yt-dlp uses by default for YouTube
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "yt-dlp[default]"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          yt-dlp --version
          deno --version | head -n 1

      # Optional secret YT_COOKIES (Netscape format, exported while LOGGED IN)
      - name: Prepare and validate cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -z "$YT_COOKIES" ]; then
            echo "::warning::No YT_COOKIES secret set. GitHub-hosted runners are usually blocked by YouTube without cookies."
            exit 0
          fi
          printf '%s\n' "$YT_COOKIES" > cookies.txt
          if grep -qE "SAPISID|__Secure-3PSID|LOGIN_INFO" cookies.txt; then
            echo "Login cookies detected."
          else
            echo "::warning::Cookies contain no login cookies (SAPISID / __Secure-3PSID / LOGIN_INFO). You were probably logged out when exporting, so the bot check will likely still fail."
          fi

      - name: Download video (480p + audio, muxed to MP4)
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          MAX_HEIGHT: ${{ inputs.max_height }}
          # Optional: repo secret PROXY_URL, e.g. http://user:pass@host:port
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          mkdir -p downloads

          EXTRA_ARGS=()
          [ -f cookies.txt ] && EXTRA_ARGS+=(--cookies cookies.txt)
          [ -n "$PROXY_URL" ] && EXTRA_ARGS+=(--proxy "$PROXY_URL")

          yt-dlp \
            --no-playlist \
            --remote-components ejs:github \
            "${EXTRA_ARGS[@]}" \
            -f "bv*[height<=${MAX_HEIGHT}]+ba/b[height<=${MAX_HEIGHT}]" \
            --merge-output-format mp4 \
            --restrict-filenames \
            --retries 10 \
            --fragment-retries 10 \
            -o "downloads/%(title).100B [%(id)s].%(ext)s" \
            "$VIDEO_URL"

      - name: Remove cookies
        if: always()
        run: rm -f cookies.txt

      - name: Verify output (resolution + audio stream)
        run: |
          ls -lh downloads
          for f in downloads/*.mp4; do
            echo "== $f =="
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height \
              -of default=noprint_wrappers=1 "$f"
          done

      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-480p
          path: downloads/*.mp4
          if-no-files-found: error
          retention-days: 7
