name: Build YouTube AdBlock TV APK

# Self-contained: no other files needed in the repo.
# Generates a small Android TV app (WebView -> youtube.com/tv) that runs the COMPLETE TizenTube UI:
#   tizentube.js - TizenTube userScript, built at build time from reisxd/TizenTube commit f99945a
#                  (v2.1.1-18, GPL-3.0) - ad blocker, SponsorBlock, DeArrow, speed, TizenTube settings,
#                  theme, previews, clock, chapters ... exactly as TizenTube ships it.
#                  If that build fails, the published @foxreis/tizentube build from jsDelivr is used instead.
#                  Remote: Green key / Menu key = TizenTube settings, Blue = playback speed, Red = theme colours
#                  (Android colour keys are passed on as the Tizen key codes 403-406).
#   app.js       - only hides YouTube's own base64 splash logo.
#   inspector.js - CAP capture tool (set DEBUG_TOOLS=false in MainActivity.java to remove it)
#                  1 = SVG + image URLs log, 2 = pick item, 3 = dump visible UI, 4 = page JS, 5 = HTML + CSS,
#                  6 = share last capture, 7 = TizenTube settings, 8 = playback speed.
# Native side:
#   Splash video - assets/splash.mp4 downloaded at build time, played full-screen once at start-up
#                  (always to the end; its last frame stays until YouTube is ready, max 4 s more).
#   Wordmark     - every white YouTube wordmark the page loads (e.g. .../youtube/wordmark/fullcolor_white_96px.png)
#                  is answered with the Premium wordmark (premium/wordmark_truncated/fullcolor_white_57_2x_v2.png),
#                  bundled into the APK at build time.
#   On-screen remote (Back / arrows / OK / TizenTube settings / Speed) on the left edge, for tablets
#   (set SHOW_REMOTE=false in MainActivity.java to remove it).
#   ONE fixed User-Agent (PlayStation 5 / SmartTV), black screen while video loads, "No internet - Retry" page,
#   app logos downloaded at build time (falls back to a built-in red icon if a download fails).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node.js (builds the TizenTube userScript)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate Android project
        run: |
          P="$GITHUB_WORKSPACE/_android"
          J="$P/app/src/main/java/com/local/ytadblock/tv"
          mkdir -p "$J" "$P/app/src/main/assets" "$P/app/src/main/res/drawable" "$P/app/src/main/res/drawable-nodpi" "$P/app/src/main/res/xml"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YtAdBlockTv"
          include ':app'
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.local.ytadblock.tv'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.local.ytadblock.tv'
                  minSdk 21
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "1")
              }

              // the splash video is played straight from the APK (MediaPlayer needs it uncompressed)
              androidResources {
                  noCompress 'mp4'
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
                      keyAlias System.getenv("KEY_ALIAS") ?: "key"
                      keyPassword System.getenv("KEY_PASSWORD") ?: "android"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="YouTube AdBlock"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation|uiMode|screenLayout|smallestScreenSize|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Lets the capture tool share saved files through the Android share sheet -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.local.ytadblock.tv.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # ---- app.js: hides YouTube's own base64 splash logo (the app plays its splash video) ----
          cat > "$P/app/src/main/assets/app.js" <<'EOF'
          (function () {
            if (window.__ytApp) return;
            window.__ytApp = true;
            // YouTube's own base64 splash logo is hidden - the app plays its own splash video instead.
            var CSS = '#loader,.splash-screen-loader{background-image:none !important;}';
            function add() {
              try {
                if (document.getElementById('yt-app-css')) return;
                var s = document.createElement('style');
                s.id = 'yt-app-css';
                s.textContent = CSS;
                (document.head || document.documentElement).appendChild(s);
              } catch (e) { }
            }
            add();
            document.addEventListener('DOMContentLoaded', add);
          })();
          EOF

          cat > "$P/app/src/main/res/xml/file_paths.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="captures_ext" path="captures/" />
              <files-path name="captures_int" path="captures/" />
          </paths>
          EOF

          # ---- inspector.js: CAP capture helpers (passive until a CAP menu button is used) ----
          cat > "$P/app/src/main/assets/inspector.js" <<'EOF'
          (function () {
            if (window.__cap) return;
            var cap = window.__cap = {};
            var picking = false;

            function pad(n) { return (n < 10 ? '0' : '') + n; }
            function stamp() {
              var d = new Date();
              return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' +
                pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
            }
            function toast(m) { try { if (window.YTCap) YTCap.toast(String(m)); } catch (e) { } }
            function send(name, text) {
              if (!window.YTCap) return;
              YTCap.begin();
              var n = 200000;
              for (var i = 0; i < text.length; i += n) YTCap.chunk(text.slice(i, i + n));
              YTCap.end(name);
            }
            function safeJson(o, space) {
              var seen = new WeakSet();
              try {
                return JSON.stringify(o, function (k, v) {
                  if (typeof v === 'function') return '[fn]';
                  if (v && typeof v === 'object') {
                    if (v.nodeType) return '[node]';
                    if (seen.has(v)) return '[circular]';
                    seen.add(v);
                  }
                  return v;
                }, space);
              } catch (e) { return '"[unserializable: ' + e + ']"'; }
            }

            function cls(el) {
              var c = el.getAttribute && el.getAttribute('class');
              return c ? c.trim() : '';
            }
            function sel(el) {
              var s = (el.tagName || '?').toLowerCase();
              if (el.id) s += '#' + el.id;
              var c = cls(el).split(/\s+/).filter(Boolean).slice(0, 6).join('.');
              if (c) s += '.' + c;
              var k = el.getAttribute && el.getAttribute('idomkey');
              if (k) s += '[idomkey="' + k + '"]';
              return s;
            }
            function r1(n) { return Math.round(n * 10) / 10; }

            var PROPS = ['backgroundColor', 'backgroundImage', 'color', 'opacity', 'borderRadius', 'boxShadow',
              'display', 'position', 'zIndex', 'visibility', 'filter', 'transform', 'mixBlendMode',
              'overflow', 'width', 'height'];

            function info(el) {
              var r = el.getBoundingClientRect(), cs = getComputedStyle(el), st = {};
              PROPS.forEach(function (p) {
                var v = cs[p];
                if (v && v !== 'none' && v !== 'normal' && v !== 'auto') st[p] = String(v).slice(0, 220);
              });
              var bf = cs.backdropFilter || cs.webkitBackdropFilter;
              if (bf && bf !== 'none') st.backdropFilter = bf;
              var attrs = {};
              if (el.attributes) for (var i = 0; i < el.attributes.length; i++) {
                var a = el.attributes[i];
                if (a.name === 'class' || a.name === 'style') continue;
                attrs[a.name] = String(a.value).slice(0, 80);
              }
              var inline = el.getAttribute && el.getAttribute('style');
              return {
                selector: sel(el),
                tag: (el.tagName || '').toLowerCase(),
                id: el.id || undefined,
                class: cls(el) || undefined,
                idomkey: (el.getAttribute && el.getAttribute('idomkey')) || undefined,
                rect: [r1(r.left), r1(r.top), r1(r.width), r1(r.height)],
                attrs: attrs,
                inlineStyle: inline ? inline.slice(0, 300) : undefined,
                text: ((el.innerText || '') + '').trim().slice(0, 80) || undefined,
                computed: st
              };
            }
            function chain(el) {
              var out = [], n = 0;
              while (el && el.nodeType === 1 && n++ < 12) { out.push(sel(el)); el = el.parentElement; }
              return out;
            }
            function header() {
              var v = document.querySelector('video');
              return {
                captured: new Date().toISOString(),
                url: location.href,
                userAgent: navigator.userAgent,
                viewport: [innerWidth, innerHeight, window.devicePixelRatio],
                realDpr: window.__realDpr ? window.__realDpr() : null,
                screen: [screen.width, screen.height, screen.availWidth, screen.availHeight],
                qmax: (function () { try { return localStorage.getItem('ytx-qmax'); } catch (e) { return null; } })(),
                bodyClass: document.body ? document.body.className : '',
                video: v ? {
                  rect: (function () { var r = v.getBoundingClientRect(); return [r1(r.left), r1(r.top), r1(r.width), r1(r.height)]; })(),
                  currentTime: v.currentTime, duration: v.duration, readyState: v.readyState,
                  paused: v.paused, playbackRate: v.playbackRate,
                  src: (v.currentSrc || v.src || '').slice(0, 80)
                } : null
              };
            }
            function flash(el) {
              try {
                var r = el.getBoundingClientRect(), d = document.createElement('div');
                d.style.cssText = 'position:fixed;z-index:2147483647;pointer-events:none;border:3px solid #0f0;' +
                  'background:rgba(0,255,0,.15);left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width +
                  'px;height:' + r.height + 'px';
                document.documentElement.appendChild(d);
                setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1500);
              } catch (e) { }
            }

            // ---- 0. SVG + image URL log: every <svg>, every image URL, icon-font glyphs ----
            // Open the screen that has the wrong icons (e.g. show the player controls, open Settings) BEFORE
            // pressing it. Pressing the button starts a 5 s timer (set in MainActivity) so the screen can be shown.
            cap.dumpSvg = function () {
              toast('Collecting SVG + image URLs...');
              var W = innerWidth, H = innerHeight, i, j, el, r, cs;
              var head = header();
              head.type = 'svg-and-images';

              function isVis(r, cs) {
                return r.width > 0 && r.height > 0 && r.right > 0 && r.bottom > 0 && r.left < W && r.top < H &&
                  cs.visibility !== 'hidden' && cs.display !== 'none';
              }
              function urlsIn(str) {
                var res = [], re = /url\((['"]?)(.*?)\1\)/g, m;
                while ((m = re.exec(str || ''))) res.push(m[2]);
                return res;
              }
              function shortUrl(u) {
                u = String(u);
                return u.length > 700 ? u.slice(0, 700) + '...[' + u.length + ' chars]' : u;
              }
              function rowText(e) {
                var p = e, n = 0, t;
                while (p && n++ < 6) {
                  t = ((p.innerText || '') + '').trim();
                  if (t && t.length < 90) return t;
                  p = p.parentElement;
                }
                return '';
              }
              function rectOf(e) { var q = e.getBoundingClientRect(); return [r1(q.left), r1(q.top), r1(q.width), r1(q.height)]; }

              // ---- SVG elements ----
              var svgs = [], all = document.getElementsByTagName('svg');
              for (i = 0; i < all.length && i < 600; i++) {
                el = all[i]; r = el.getBoundingClientRect(); cs = getComputedStyle(el);
                var uses = [], imgs = [], us = el.querySelectorAll('use'), ims = el.querySelectorAll('image');
                for (j = 0; j < us.length; j++) {
                  uses.push(us[j].getAttribute('href') || us[j].getAttributeNS('http://www.w3.org/1999/xlink', 'href') || '');
                }
                for (j = 0; j < ims.length; j++) {
                  imgs.push(shortUrl(ims[j].getAttribute('href') || ims[j].getAttributeNS('http://www.w3.org/1999/xlink', 'href') || ''));
                }
                svgs.push({
                  n: i,
                  visible: isVis(r, cs),
                  selector: sel(el),
                  parents: chain(el).slice(1, 8),
                  rect: [r1(r.left), r1(r.top), r1(r.width), r1(r.height)],
                  viewBox: el.getAttribute('viewBox') || undefined,
                  fill: cs.fill, stroke: cs.stroke, color: cs.color, opacity: cs.opacity,
                  rowText: rowText(el) || undefined,
                  uses: uses.length ? uses : undefined,
                  images: imgs.length ? imgs : undefined,
                  outerHTML: (el.outerHTML || '').slice(0, 6000)
                });
              }
              svgs.sort(function (a, b) { return (b.visible ? 1 : 0) - (a.visible ? 1 : 0); });

              // ---- image URLs ----
              var found = [], glyphs = [];
              function addUrl(kind, u, e, extra) {
                if (!u || found.length >= 900) return;
                var q = e.getBoundingClientRect ? e.getBoundingClientRect() : { left: 0, top: 0, width: 0, height: 0 };
                found.push({
                  kind: kind, url: shortUrl(u),
                  selector: sel(e), rect: [r1(q.left), r1(q.top), r1(q.width), r1(q.height)],
                  extra: extra || undefined
                });
              }
              var ALLEL = document.getElementsByTagName('*');
              var PUA = /^[\uE000-\uF8FF]{1,2}$/;
              for (i = 0; i < ALLEL.length && i < 7000; i++) {
                el = ALLEL[i];
                var tg = el.tagName.toLowerCase();
                if (tg === 'img') {
                  addUrl('img', el.currentSrc || el.src, el, 'natural=' + el.naturalWidth + 'x' + el.naturalHeight);
                } else if (tg === 'video' && el.poster) {
                  addUrl('video-poster', el.poster, el);
                } else if (tg === 'image') {
                  addUrl('svg-image', el.getAttribute('href') || el.getAttributeNS('http://www.w3.org/1999/xlink', 'href'), el);
                } else if (tg === 'source' && el.src) {
                  addUrl('source', el.src, el);
                }
                if (tg === 'script' || tg === 'style' || tg === 'path') continue;
                cs = getComputedStyle(el);
                var props = [['background-image', cs.backgroundImage], ['mask-image', cs.webkitMaskImage || cs.maskImage],
                  ['border-image', cs.borderImageSource], ['list-style-image', cs.listStyleImage], ['content', cs.content]];
                for (j = 0; j < props.length; j++) {
                  if (props[j][1] && props[j][1] !== 'none' && props[j][1].indexOf('url(') >= 0) {
                    urlsIn(props[j][1]).forEach(function (u) { addUrl('css:' + props[j][0], u, el, cs.backgroundSize || undefined); });
                  }
                }
                ['::before', '::after'].forEach(function (ps) {
                  try {
                    var pc = getComputedStyle(el, ps);
                    if (!pc || pc.content === 'none' || pc.content === 'normal') return;
                    var pv = [pc.backgroundImage, pc.webkitMaskImage || pc.maskImage, pc.content];
                    pv.forEach(function (s) {
                      if (s && s.indexOf('url(') >= 0) urlsIn(s).forEach(function (u) { addUrl('pseudo' + ps, u, el); });
                    });
                  } catch (e) { }
                });
                // icon-font glyphs (private-use characters)
                var own = '';
                for (var c = el.firstChild; c; c = c.nextSibling) if (c.nodeType === 3) own += c.nodeValue;
                own = own.trim();
                if (own && PUA.test(own) && glyphs.length < 300) {
                  glyphs.push({
                    codepoints: own.split('').map(function (ch) { return 'U+' + ch.charCodeAt(0).toString(16).toUpperCase(); }).join(' '),
                    fontFamily: cs.fontFamily, selector: sel(el), rect: rectOf(el), color: cs.color
                  });
                }
              }

              // ---- url() inside stylesheets (sprites, masks, data:image/svg+xml icons) ----
              var sheetUrls = [], seenSheet = {};
              function scanRules(rules, label) {
                for (var a = 0; a < rules.length && sheetUrls.length < 600; a++) {
                  var rule = rules[a], txt = rule.cssText || '';
                  if (rule.cssRules && !rule.selectorText) { try { scanRules(rule.cssRules, label); } catch (e) { } continue; }
                  if (txt.indexOf('url(') < 0) continue;
                  urlsIn(txt).forEach(function (u) {
                    var k = (rule.selectorText || '') + '|' + u;
                    if (seenSheet[k] || /^data:font|\.woff|\.ttf|\.otf/i.test(u)) return;
                    seenSheet[k] = 1;
                    sheetUrls.push({ sheet: label, selector: (rule.selectorText || '').slice(0, 160), url: shortUrl(u) });
                  });
                }
              }
              for (i = 0; i < document.styleSheets.length; i++) {
                var ss = document.styleSheets[i];
                try { scanRules(ss.cssRules, ss.href || ('inline #' + i)); } catch (e) { }
              }

              // ---- <link rel=icon>, meta og:image, resource list ----
              var links = [];
              [].forEach.call(document.querySelectorAll('link[rel*="icon"],link[rel="image_src"],meta[property="og:image"]'), function (l) {
                links.push(l.href || l.content || '');
              });
              var res = [];
              try {
                performance.getEntriesByType('resource').forEach(function (e) {
                  if (e.initiatorType === 'img' || e.initiatorType === 'image' ||
                      /\.(png|jpe?g|webp|gif|svg|ico)(\?|$)/i.test(e.name) || /ytimg|gstatic.*img|ggpht/i.test(e.name)) {
                    if (res.length < 500) res.push({ type: e.initiatorType, size: e.transferSize || e.decodedBodySize || 0, url: shortUrl(e.name) });
                  }
                });
              } catch (e) { }

              var vis = svgs.filter(function (s) { return s.visible; }).length;
              var text = 'YTCAP SVG + image URL log\n' + safeJson(head, 1) + '\n\n' +
                '===== SUMMARY =====\n' +
                'svg elements: ' + all.length + ' (visible: ' + vis + ')\n' +
                'image urls found in DOM/CSS: ' + found.length + '\n' +
                'icon-font glyphs: ' + glyphs.length + '\n' +
                'stylesheet url() rules: ' + sheetUrls.length + '\n' +
                'resource entries (images): ' + res.length + '\n\n' +
                '===== SVG ELEMENTS (visible first) =====\n' + safeJson(svgs, 1) + '\n\n' +
                '===== IMAGE URLS (img / svg-image / css background / mask / pseudo) =====\n' + safeJson(found, 1) + '\n\n' +
                '===== ICON-FONT GLYPHS =====\n' + safeJson(glyphs, 1) + '\n\n' +
                '===== STYLESHEET url() RULES =====\n' + safeJson(sheetUrls, 1) + '\n\n' +
                '===== LINK / META IMAGES =====\n' + safeJson(links, 1) + '\n\n' +
                '===== RESOURCE LIST (images) =====\n' + safeJson(res, 1) + '\n';
              send('svg_images_' + stamp() + '.txt', text);
            };

            // ---- 1. Pick: tap an item, capture everything stacked at that point ----
            function capturePoint(x, y) {
              var stack = document.elementsFromPoint(x, y).slice(0, 14);
              if (!stack.length) { toast('Nothing found at that point'); return; }
              flash(stack[0]);
              var out = header();
              out.type = 'element-pick';
              out.point = [Math.round(x), Math.round(y)];
              out.ancestorsOfTop = chain(stack[0]);
              out.topOuterHTML = (stack[0].outerHTML || '').slice(0, 1500);
              out.stackTopToBottom = stack.map(info);
              out.tectonicConfig = window.tectonicConfig ? JSON.parse(safeJson(window.tectonicConfig)) : null;
              send('element_' + stamp() + '.txt', safeJson(out, 1));
            }
            cap.pick = function () {
              if (picking) return;
              picking = true;
              toast('Tap the item you want to capture');
              var types = ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'];
              var done = false;
              function handler(e) {
                e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
                if (done) return;
                if (e.type === 'pointerup' || e.type === 'touchend' || e.type === 'mouseup' || e.type === 'click') {
                  var t = (e.changedTouches && e.changedTouches[0]) || e;
                  if (typeof t.clientX !== 'number') return;
                  done = true;
                  capturePoint(t.clientX, t.clientY);
                  setTimeout(function () {
                    types.forEach(function (n) { window.removeEventListener(n, handler, true); });
                    picking = false;
                  }, 600);
                }
              }
              types.forEach(function (n) { window.addEventListener(n, handler, true); });
            };

            // ---- 2. Dump visible UI: every visible, styled element (use after showing the controls) ----
            cap.dumpUi = function () {
              var lines = [], all = document.body.getElementsByTagName('*'), W = innerWidth, H = innerHeight;
              for (var i = 0; i < all.length && lines.length < 1800; i++) {
                var el = all[i], r = el.getBoundingClientRect();
                if (r.width < 8 || r.height < 8 || r.right < 0 || r.bottom < 0 || r.left > W || r.top > H) continue;
                var cs = getComputedStyle(el);
                if (cs.visibility === 'hidden' || cs.display === 'none') continue;
