name: Build TizenTube Android TV APK

# Single, standalone workflow. Drop this one file into  .github/workflows/  of any repo
# (the repo can be empty) and run it from the Actions tab. Nothing else is required.
#
# What it does
#   1. Fetches the TizenTube source (https://github.com/reisxd/TizenTube) at build time.
#   2. Builds a slim userscript from it containing ONLY:
#        - AdBlock        (mods/features/adblock.js)
#        - SponsorBlock   (mods/features/sponsorblock.js)
#        - TizenTube UI   (mods/ui/*  - settings menu, theme, sidebar, player buttons ...)
#      Every other TizenTube feature (PiP, auto frame rate, preferred quality, caption
#      persistence, extra subtitles, video queue, updater, UA spoofing ...) is left out.
#   3. Generates a tiny Android TV app (WebView -> https://www.youtube.com/tv) that injects
#      that userscript before the page runs, plus a network-level ad-host filter.
#   4. Builds and signs a release APK and uploads it as an artifact (and optionally a release).
#
# Optional secrets (for a permanent signing key so updates install over old versions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them a keystore is generated once and kept in the Actions cache.

on:
  workflow_dispatch:
    inputs:
      tizentube_ref:
        description: "TizenTube git ref to build the UI/AdBlock/SponsorBlock from (commit SHA, tag or branch). Use 'main' for the latest upstream UI."
        required: false
        default: "f99945a84ff767bf14ad8c1146e8e3fd49a3d628"
        type: string
      ua_profile:
        description: "User-Agent the WebView presents to YouTube TV. If the TV UI does not load, try another one."
        required: false
        default: "tizen"
        type: choice
        options:
          - tizen
          - cobalt
          - ps5
          - custom
      custom_user_agent:
        description: "Only used when ua_profile = custom"
        required: false
        default: ""
        type: string
      version_name:
        description: "App versionName (blank = 1.0.<run number>)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Also publish the APK as a GitHub Release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: tizentube-androidtv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TT_REPO: https://github.com/reisxd/TizenTube.git
      TT_REF: ${{ inputs.tizentube_ref || 'f99945a84ff767bf14ad8c1146e8e3fd49a3d628' }}
      UA_PROFILE: ${{ inputs.ua_profile || 'tizen' }}
      CUSTOM_UA: ${{ inputs.custom_user_agent || '' }}
      IN_VERSION: ${{ inputs.version_name || '' }}
      PUBLISH_RELEASE: ${{ inputs.publish_release || startsWith(github.ref, 'refs/tags/') }}
      HAS_KEYSTORE_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      APP_ID: com.tizentube.androidtv
      GRADLE_VERSION: "8.11.1"
      AGP_VERSION: "8.7.3"
