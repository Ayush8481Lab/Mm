<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict DRM Protected Video</title>
    
    <!-- Load Google's Shaka Player library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.7/shaka-player.compiled.js"></script>
    
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        
        #video-container {
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100%;
            display: block;
        }

        .warning {
            margin-bottom: 20px;
            text-align: center;
            color: #ff4757;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="warning">
        <h2>🔒 STRICT </h2>
        <p>Highly security</p>
        <p id="status-text" style="color: #ffa502;">Loading...</p>
    </div>

    <!-- The Video Player -->
    <div id="video-container">
        <video id="secure-video" controls autoplay></video>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', initApp);

        function initApp() {
            shaka.polyfill.installAll();
            if (shaka.Player.isBrowserSupported()) {
                initPlayer();
            } else {
                document.getElementById('status-text').innerText = 'Browser not supported.';
            }
        }

        async function initPlayer() {
            const videoElement = document.getElementById('secure-video');
            const player = new shaka.Player(videoElement);

            player.addEventListener('error', (event) => {
                console.error('Error code', event.detail.code, 'object', event.detail);
                document.getElementById('status-text').innerText = `Error: Your browser refused strict hardware security (Code: ${event.detail.code}).`;
                document.getElementById('status-text').style.color = "#ff4757";
            });

            // 2. CONFIGURE STRICT HARDWARE DRM (WIDEVINE L1)
            player.configure({
                drm: {
                    servers: {
                        'com.widevine.alpha': 'https://wv-sony.service.expressplay.com/hms/wv/rights/?ExpressPlayToken=CAA2T1gfKdcAJDFhZWU2MmNiLTA2YzQtNDFmZC1iZjdkLWRhZDg2NWFlNWNmYwAAAIAV71quPN1jWsGK2NuEP0PyaA5dfmPQfAvO_FKIjL0kgI5-Jnzuj9-Mj-sAfsuxfiSoUXXW5jVP35uWFZ6rln3gwopl3lRUSJvOuIC-0ADbNKimoU0wjnRDbk3yOPkkX22jJpMxEbuBtsZXGJbiTdhGBg9Y4_VTLPUW2cEkP8yTXjoAsJAbb7tJwP135aIfOqtIaBDv&id=71f87a44f87c6febaf4dd26f43fd397290847798'
                    },
                    advanced: {
                        'com.widevine.alpha': {
                            // THIS IS THE MAGIC LINE THAT BLOCKS SCREENSHOTS
                            videoRobustness: 'HW_SECURE_ALL', 
                            audioRobustness: 'SW_SECURE_CRYPTO'
                        }
                    }
                }
            });

            const videoUrl = 'https://hello-amh.pages.dev/Proxy?url=https://dishdrm.sonyliv.com/DASH/200b72a9ad444bbca6cb31510fee28d3/1790084781/baseline-std-v4/1090543528_22092026_eng_baseline-800300010.mpd?hdnea=exp=1790143696~acl=/DASH/200b72a9ad444bbca6cb31510fee28d3/1790084781/baseline-std-v4/1090543528_22092026_eng_baseline-800300010.mpd*~id=42a09f4f7b0f4f73914149ae63830e25-1785054766750~hmac=19bac2516de46d7ca1c66b5ec075c468b326e1c09d9fbdda21287b2aa657342b';

            try {
                await player.load(videoUrl);
                document.getElementById('status-text').innerText = ' secure video playing';
                document.getElementById('status-text').style.color = "#2ed573";
            } catch (e) {
                // If it fails here, it means the phone/browser cannot guarantee screenshot protection
                console.error('Error loading video', e);
                document.getElementById('status-text').innerText = 'Playback Failed: Your device/browser pass Google security certificate';
                document.getElementById('status-text').style.color = "#ff4757";
            }
        }
        
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
