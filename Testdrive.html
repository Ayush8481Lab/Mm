<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRM Protected Secure Video</title>
    
    <!-- Load Google's Shaka Player library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.7/shaka-player.compiled.js"></script>
    
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        
        #video-container {
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100%;
            display: block;
        }

        .warning {
            margin-bottom: 20px;
            text-align: center;
            color: #ff4757;
        }
        
        .note {
            font-size: 0.85em;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <div class="warning">
        <h2>🔒 DRM Protected Video (Widevine L3)</h2>
        <p class="note">Note: L3 uses Software-level protection.</p>
    </div>

    <!-- The Video Player -->
    <div id="video-container">
        <video id="secure-video" controls autoplay></video>
    </div>

    <script>
        // 1. Wait for the page to load
        document.addEventListener('DOMContentLoaded', initApp);

        function initApp() {
            // Check if the browser supports Shaka Player (EME support)
            shaka.polyfill.installAll();
            if (shaka.Player.isBrowserSupported()) {
                initPlayer();
            } else {
                alert('Browser not supported for secure video playback.');
            }
        }

        async function initPlayer() {
            const videoElement = document.getElementById('secure-video');
            const player = new shaka.Player(videoElement);

            // Listen for errors and log detailed information to console
            player.addEventListener('error', (event) => {
                console.error('Shaka Player Error:', event.detail.code, event.detail);
            });

            // Optional: If ExpressPlay or your backend requires custom HTTP Headers for the license request
            /*
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                if (type == shaka.net.NetworkingEngine.RequestType.LICENSE) {
                    // request.headers['Custom-Auth-Header'] = 'your-token-here';
                }
            });
            */

            // 2. CONFIGURE DRM (WIDEVINE L3)
            player.configure({
                drm: {
                    servers: {
                        // Ensure your ExpressPlay URL includes the ExpressPlayToken parameter
                        'com.widevine.alpha': 'https://jiotvegp.vercel.app/api/Spotify?url=https%3A%2F%2Fgae2-spclient.spotify.com%2Fwidevine-license%2Fv1%2Faudio%2Flicense'
                    },
                    advanced: {
                        'com.widevine.alpha': {
                            // This explicitly forces Widevine L3 (Software Decryption)
                            videoRobustness: 'SW_SECURE_CRYPTO',
                            audioRobustness: 'SW_SECURE_CRYPTO'
                        }
                    }
                }
            });

            // 3. LOAD THE ENCRYPTED VIDEO
            const videoUrl = 'https://audio-ak.spotifycdn.com/audio/4186efdfd77766dcf526be93b2500dfd762e2ab4?__token__=exp=1790661005~hmac=a04497a3ad31efe58b0e46080d4b2a6503c1bc72b59cc75f564770a0276ef33b'
            try {
                await player.load(videoUrl);
                console.log('The Widevine L3 encrypted video has successfully loaded!');
            } catch (e) {
                console.error('Error loading video', e);
            }
        }
        
        // Basic right-click protection for the web page
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
