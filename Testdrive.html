<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Spotify DRM Audio Player (EME + MSE)</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
        #controls { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 600px; margin-bottom: 20px; }
        input, button { padding: 10px; border-radius: 5px; border: 1px solid #333; background: #222; color: #fff; }
        button { background: #1DB954; border: none; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 10px; font-size: 0.9em; color: #aaa; max-width: 600px; word-break: break-all; }
        #audio-container { width: 100%; max-width: 600px; margin-top: 20px; }
        audio { width: 100%; }
    </style>
</head>
<body>
    <h1>Custom Spotify DRM Player</h1>
    <div id="controls">
        <label>Spotify Access Token (tok):</label>
        <input type="text" id="accessToken" placeholder="Paste your Spotify access token here">
        <label>Spotify sp_dc Cookie:</label>
        <input type="text" id="spDcCookie" placeholder="Paste your sp_dc cookie value here">
        <label>Encrypted Audio URL (from CDN):</label>
        <input type="text" id="audioUrl" placeholder="https://audio-ak.spotifycdn.com/audio/..." style="width: 100%;">
        <button id="playBtn" disabled>Load & Play</button>
    </div>
    <div id="status">Initializing...</div>
    <div id="audio-container">
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Replace with your own CORS proxy that forwards requests to the Spotify license server.
        // Example: https://your-proxy.workers.dev/?url=
        const LICENSE_PROXY_URL = 'https://jiotvegp.vercel.app/api/Spotify?url=';
        
        // Spotify's Widevine license endpoint.
        const SPOTIFY_LICENSE_ENDPOINT = 'https://api.spotify.com/v1/widevine-license/v1/audio/license';

        // The audio player element.
        const audioElement = document.getElementById('audioPlayer');
        const statusElement = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');

        // Global variables for the EME session.
        let mediaKeys = null;
        let mediaKeySession = null;
        let mediaSource = null;
        let sourceBuffer = null;

        // --- UI HELPER ---
        function setStatus(message, isError = false) {
            console.log(`[Status] ${message}`);
            statusElement.textContent = message;
            statusElement.style.color = isError ? '#ff4757' : '#2ed573';
        }

        // --- MAIN WORKFLOW ---
        playBtn.addEventListener('click', async () => {
            playBtn.disabled = true;
            const accessToken = document.getElementById('accessToken').value.trim();
            const spDcCookie = document.getElementById('spDcCookie').value.trim();
            const audioUrl = document.getElementById('audioUrl').value.trim();

            if (!accessToken || !audioUrl) {
                setStatus('Error: Access token and audio URL are required.', true);
                playBtn.disabled = false;
                return;
            }

            try {
                await initializePlayback(audioUrl, accessToken, spDcCookie);
            } catch (error) {
                setStatus(`Playback failed: ${error.message}`, true);
                console.error(error);
                playBtn.disabled = false;
            }
        });

        async function initializePlayback(audioUrl, accessToken, spDcCookie) {
            setStatus('Step 1: Fetching initial audio chunk...');
            
            // 1. Fetch the first chunk of the encrypted audio to get the initData (PSSH box).
            const initialChunk = await fetchAudioChunk(audioUrl, 0, 1024 * 1024, accessToken, spDcCookie);
            if (initialChunk.byteLength === 0) {
                throw new Error('Failed to fetch initial audio chunk. Check your URL and tokens.');
            }

            setStatus('Step 2: Extracting initData (PSSH box)...');
            const initData = extractPsshBox(initialChunk);
            if (!initData) {
                throw new Error('Could not find PSSH box in the audio chunk. The content may not be encrypted or the format is unexpected.');
            }
            console.log('Extracted initData:', initData);

            setStatus('Step 3: Requesting MediaKeySystemAccess...');
            // 2. Request access to the Widevine CDM.
            // For audio-only, we only need 'audioCapabilities'.
            const config = [{
                initDataTypes: ['cenc'],
                audioCapabilities: [{
                    contentType: 'audio/mp4; codecs="mp4a.40.2"', // AAC-LC in MP4 container
                    robustness: 'SW_SECURE_CRYPTO' // Use L3 software decryption
                }]
            }];

            const access = await navigator.requestMediaKeySystemAccess('com.widevine.alpha', config);
            mediaKeys = await access.createMediaKeys();

            setStatus('Step 4: Creating MediaKeySession and generating license request...');
            // 3. Create a session and generate the license challenge.
            mediaKeySession = mediaKeys.createSession();
            
            // Listen for the license request message from the CDM.
            mediaKeySession.addEventListener('message', async (event) => {
                setStatus('Step 5: Sending license request to Spotify...');
                await handleLicenseRequest(event.message, accessToken);
            });

            // Listen for key status changes to know when decryption keys are ready.
            mediaKeySession.addEventListener('keystatuseschange', (event) => {
                const keys = Array.from(mediaKeySession.keyStatuses.entries());
                console.log('Key statuses changed:', keys);
                const hasUsableKey = keys.some(([keyId, status]) => status === 'usable');
                if (hasUsableKey) {
                    setStatus('Decryption keys acquired! Starting media playback...', false);
                    startMediaStreaming(audioUrl, accessToken, spDcCookie, initialChunk);
                }
            });

            // Generate the license request.
            await mediaKeySession.generateRequest('cenc', initData);
        }

        // --- CORE FUNCTIONS ---

        /**
         * Fetches a byte range from the audio URL.
         * Note: Spotify's CDN may require the Authorization header or cookies.
         */
        async function fetchAudioChunk(url, start, end, accessToken, spDcCookie) {
            const headers = {
                'Range': `bytes=${start}-${end}`,
                // These headers are typically required to access the CDN.
                // The exact requirements can vary. The accessToken is often passed as a Bearer token.
                'Authorization': `Bearer ${accessToken}`,
                // Cookies might be needed for session validation.
                // 'Cookie': `sp_dc=${spDcCookie}`
            };

            const response = await fetch(url, { headers });
            if (!response.ok) {
                throw new Error(`Failed to fetch audio: ${response.status} ${response.statusText}`);
            }
            return await response.arrayBuffer();
        }

        /**
         * Parses the fetched buffer to find the 'pssh' box.
         * The PSSH box is a top-level box in the ISO BMFF (MP4) container.
         */
        function extractPsshBox(buffer) {
            const dataView = new DataView(buffer);
            let offset = 0;
            const length = buffer.byteLength;

            while (offset < length) {
                // Each box starts with a 4-byte size.
                if (offset + 8 > length) break; // Not enough data for a box header.
                const size = dataView.getUint32(offset);
                const type = String.fromCharCode(
                    dataView.getUint8(offset + 4),
                    dataView.getUint8(offset + 5),
                    dataView.getUint8(offset + 6),
                    dataView.getUint8(offset + 7)
                );

                if (type === 'pssh') {
                    // Found the PSSH box! Return the entire box, including its size and type.
                    return buffer.slice(offset, offset + size);
                }
                if (size === 0) break; // A size of 0 means the box extends to the end of the file.
                offset += size;
            }
            return null;
        }

        /**
         * Handles the license request by sending the CDM's challenge to Spotify's license server.
         */
        async function handleLicenseRequest(message, accessToken) {
            // Construct the full license URL with required query parameters.
            // 'exp' is an expiration timestamp (e.g., 1 hour from now).
            // 'cp' is often an empty parameter.
            // 'tok' is the user's access token.
            const exp = Math.floor(Date.now() / 1000) + 3600; // 1 hour expiry
            const licenseUrl = `${SPOTIFY_LICENSE_ENDPOINT}?exp=${exp}&cp=&tok=${accessToken}`;
            
            // Route through a CORS proxy. The proxy must forward the URL and the request body.
            const proxyUrl = LICENSE_PROXY_URL + encodeURIComponent(licenseUrl);

            try {
                const response = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/octet-stream',
                        // Some proxies require the Origin header to be set.
                        // 'Origin': 'https://open.spotify.com'
                    },
                    body: message // The CDM's license challenge.
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`License server responded with ${response.status}: ${errorText}`);
                }

                const license = await response.arrayBuffer();
                setStatus('License received. Updating session...');
                // Pass the license to the CDM to derive the decryption keys.
                await mediaKeySession.update(license);

            } catch (error) {
                setStatus(`License request failed: ${error.message}`, true);
                console.error('License request error:', error);
                throw error;
            }
        }

        /**
         * Sets up MSE and begins streaming the encrypted audio chunks.
         */
        async function startMediaStreaming(url, accessToken, spDcCookie, initialChunk) {
            // 1. Create a MediaSource and attach it to the audio element.
            mediaSource = new MediaSource();
            audioElement.src = URL.createObjectURL(mediaSource);

            mediaSource.addEventListener('sourceopen', async () => {
                try {
                    // 2. Create a SourceBuffer for the AAC audio codec.
                    // The codec string 'mp4a.40.2' corresponds to AAC-LC.
                    const mimeCodec = 'audio/mp4; codecs="mp4a.40.2"';
                    sourceBuffer = mediaSource.addSourceBuffer(mimeCodec);

                    // 3. Set the MediaKeys on the audio element to enable decryption.
                    await audioElement.setMediaKeys(mediaKeys);

                    // 4. Append the initial chunk (which includes the header and initData).
                    sourceBuffer.appendBuffer(initialChunk);
                    await new Promise(resolve => sourceBuffer.addEventListener('updateend', resolve, { once: true }));

                    // 5. Begin fetching and appending subsequent chunks.
                    await streamRemainingChunks(url, accessToken, spDcCookie, initialChunk.byteLength);

                } catch (error) {
                    setStatus(`MediaSource setup failed: ${error.message}`, true);
                    console.error(error);
                }
            });
        }

        /**
         * Fetches and appends the remaining chunks of the audio file.
         */
        async function streamRemainingChunks(url, accessToken, spDcCookie, startOffset) {
            const CHUNK_SIZE = 512 * 1024; // ~512 kB, typical for Spotify
            let offset = startOffset;
            const totalLength = parseInt((await fetch(url, { method: 'HEAD' })).headers.get('Content-Length'), 10);

            setStatus(`Streaming audio... (Total size: ${(totalLength / 1024 / 1024).toFixed(2)} MB)`);

            while (offset < totalLength) {
                try {
                    const chunk = await fetchAudioChunk(url, offset, offset + CHUNK_SIZE - 1, accessToken, spDcCookie);
                    if (chunk.byteLength === 0) break;

                    // Wait for the SourceBuffer to be ready for more data.
                    if (sourceBuffer.updating) {
                        await new Promise(resolve => sourceBuffer.addEventListener('updateend', resolve, { once: true }));
                    }
                    
                    sourceBuffer.appendBuffer(chunk);
                    offset += chunk.byteLength;
                    
                    // Wait for the append to finish before fetching the next chunk.
                    await new Promise(resolve => sourceBuffer.addEventListener('updateend', resolve, { once: true }));

                    // Update status with progress.
                    const progress = ((offset / totalLength) * 100).toFixed(1);
                    setStatus(`Streaming audio... ${progress}%`);

                } catch (error) {
                    setStatus(`Streaming error: ${error.message}`, true);
                    console.error('Streaming error:', error);
                    break;
                }
            }

            if (offset >= totalLength) {
                setStatus('Playback complete.', false);
                if (mediaSource.readyState === 'open') {
                    mediaSource.endOfStream();
                }
            }
        }

        // Initial status
        setStatus('Ready. Please fill in the fields and click "Load & Play".');
    </script>
</body>
</html>
