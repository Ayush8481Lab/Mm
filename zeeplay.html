<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player</title>
    <!-- Load HLS.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --primary: #ffffff; 
            --live-red: #ff3333;
            --text: #ffffff;
        }

        /* Prevent blue highlight on mobile touch and accidental text selection */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
            cursor: pointer; 
        }

        /* Controls Overlay */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 80px 20px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 1;
            transition: opacity 0.3s ease;
            z-index: 10;
            pointer-events: none;
        }

        .player-container.idle .controls-overlay {
            opacity: 0;
        }
        
        .player-container.idle {
            cursor: none;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 18px;
            pointer-events: auto;
        }

        button {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.85;
            transition: opacity 0.2s, transform 0.1s;
            outline: none;
        }

        button:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Live Indicator */
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .live-indicator:hover {
            opacity: 1;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--live-red);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--live-red);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .live-dot.behind {
            background-color: #888;
            box-shadow: none;
        }

        /* Volume Slider */
        .volume-container {
            display: flex;
            align-items: center;
        }

        .volume-slider {
            width: 0;
            opacity: 0;
            transition: width 0.3s ease, opacity 0.3s ease;
            overflow: hidden;
            padding-left: 0;
        }

        .volume-container:hover .volume-slider, .volume-slider input:active {
            width: 75px;
            opacity: 1;
            padding-left: 8px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.4);
            border-radius: 2px;
        }

        /* Settings Menu */
        .settings-menu {
            position: absolute;
            bottom: 60px;
            right: 20px;
            background: rgba(24, 24, 24, 0.95);
            border-radius: 6px;
            min-width: 140px;
            display: none;
            flex-direction: column;
            z-index: 20;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            overflow: hidden;
            pointer-events: auto;
            backdrop-filter: blur(8px);
        }

        .settings-menu.show {
            display: flex;
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-header {
            padding: 10px 15px;
            font-size: 12px;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
        }

        .settings-item {
            padding: 10px 15px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .settings-item:hover {
            background: rgba(255,255,255,0.15);
        }

        .settings-item.active {
            color: #007bff;
            font-weight: 600;
        }

        .settings-item.active::after {
            content: '✓';
            font-size: 14px;
        }

        /* Center Play/Pause Button */
        .center-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85px;
            height: 85px;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
            color: white;
            pointer-events: auto;
            filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.75)); 
        }

        .center-play:hover {
            transform: translate(-50%, -50%) scale(1.15);
        }
        
        .center-play:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .center-play svg {
            width: 100%;
            height: 100%;
            fill: white;
        }

        /* Hide Center Button when controls go idle or on error */
        .player-container.idle .center-play,
        .player-container.error .center-play {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(1.3);
        }

        /* BOLD WHITE/GREY FAST SPINNER */
        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.25);
            border-top: 5px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
            z-index: 4;
            filter: drop-shadow(0px 2px 5px rgba(0,0,0,0.5));
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Show loading ONLY if there's no error */
        .loading:not(.error) .spinner { display: block; }
        .loading .center-play { display: none; }

        /* Error Messaging */
        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            background: rgba(24, 24, 24, 0.95);
            padding: 16px 24px;
            border-radius: 8px;
            border: 1px solid rgba(255, 51, 51, 0.4);
            font-size: 14px;
            font-weight: 500;
            display: none;
            z-index: 20;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            max-width: 80%;
            word-wrap: break-word;
            backdrop-filter: blur(8px);
        }
        
        .error-icon {
            display: block;
            margin: 0 auto 10px;
            width: 32px;
            height: 32px;
            fill: var(--live-red);
        }
    </style>
</head>
<body>

    <div class="player-container" id="player-container">
        <!-- Native video element -->
        <video id="video" playsinline></video>
        
        <div class="spinner" id="spinner"></div>
        
        <!-- Center Play/Pause Button -->
        <div class="center-play" id="center-play" title="Play/Pause">
            <svg id="center-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="center-pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </div>

        <div class="error-message" id="error-message">
            <svg class="error-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span id="error-text">Playback Error</span>
        </div>

        <div class="controls-overlay" id="controls">
            <div class="controls-left">
                <button id="play-pause-btn" title="Play/Pause">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                
                <div class="volume-container">
                    <button id="mute-btn" title="Mute/Unmute">
                        <svg id="vol-up-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <svg id="vol-off-icon" viewBox="0 0 24 24" style="display: none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                    </button>
                    <div class="volume-slider">
                        <!-- Volume starts at 1 (100%) -->
                        <input type="range" id="volume-range" min="0" max="1" step="0.05" value="1">
                    </div>
                </div>

                <div class="live-indicator" id="live-indicator" title="Sync to Live Edge">
                    <div class="live-dot" id="live-dot"></div>
                    LIVE
                </div>
            </div>

            <div class="controls-right">
                <!-- Picture-in-Picture Button -->
                <button id="pip-btn" title="Picture-in-Picture" style="display: none;">
                    <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V5c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 0H3V5h18v14z"/></svg>
                </button>
                
                <button id="settings-btn" title="Quality Settings">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
                <button id="fullscreen-btn" title="Fullscreen">
                    <svg id="fs-enter-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    <svg id="fs-exit-icon" viewBox="0 0 24 24" style="display: none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
                </button>
            </div>
        </div>
        
        <div class="settings-menu" id="settings-menu">
            <div class="settings-header">Video Quality</div>
            <div id="quality-list">
                <!-- Quality items injected via JS -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('video');
            const container = document.getElementById('player-container');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');
            const centerPlay = document.getElementById('center-play');
            const centerPlayIcon = document.getElementById('center-play-icon');
            const centerPauseIcon = document.getElementById('center-pause-icon');
            const muteBtn = document.getElementById('mute-btn');
            const volUpIcon = document.getElementById('vol-up-icon');
            const volOffIcon = document.getElementById('vol-off-icon');
            const volumeRange = document.getElementById('volume-range');
            const pipBtn = document.getElementById('pip-btn');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const fsEnterIcon = document.getElementById('fs-enter-icon');
            const fsExitIcon = document.getElementById('fs-exit-icon');
            const settingsBtn = document.getElementById('settings-btn');
            const settingsMenu = document.getElementById('settings-menu');
            const qualityList = document.getElementById('quality-list');
            const liveIndicator = document.getElementById('live-indicator');
            const liveDot = document.getElementById('live-dot');
            const errorMsg = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            
            let hls = null;
            let hideControlsTimeout = null;
            let clickTimer = null;
            let previousVolume = 1;
            let isErrorState = false;

            // --- ERROR HANDLING LOGIC ---
            function showError(msg) {
                isErrorState = true;
                errorText.innerText = msg;
                errorMsg.style.display = 'block';
                container.classList.add('error');
                container.classList.remove('loading'); // Stop spinner
            }

            // Catch native HTML5 Video element errors
            video.addEventListener('error', () => {
                showError("Playback Error: Stream could not be loaded.");
            });

            // --- UI Volume Sync ---
            function updateVolumeUI() {
                volumeRange.value = video.muted ? 0 : video.volume;
                if (video.muted || video.volume === 0) {
                    volUpIcon.style.display = 'none';
                    volOffIcon.style.display = 'block';
                } else {
                    volUpIcon.style.display = 'block';
                    volOffIcon.style.display = 'none';
                }
            }

            // --- Smart Autoplay Logic ---
            function attemptAutoplay() {
                if (isErrorState) return;
                
                video.muted = false;
                video.volume = 1;
                
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        updateVolumeUI();
                    }).catch(error => {
                        if (error.name === 'NotAllowedError') {
                            video.muted = true;
                            video.play().catch(e => console.log("Muted autoplay blocked:", e));
                            updateVolumeUI();
                        }
                    });
                }
            }

            // --- URL PARSING ---
            function getUrlParameter() {
                const searchStr = window.location.search;
                let extractedUrl = null;
                
                if (searchStr.indexOf('?url=') !== -1) {
                    extractedUrl = searchStr.substring(searchStr.indexOf('?url=') + 5);
                } else if (searchStr.indexOf('&url=') !== -1) {
                    extractedUrl = searchStr.substring(searchStr.indexOf('&url=') + 5);
                }

                if (extractedUrl) {
                    if (extractedUrl.includes('%3A') || extractedUrl.includes('%2F') || extractedUrl.includes('%26')) {
                        try { return decodeURIComponent(extractedUrl); } catch (e) { }
                    }
                    return extractedUrl;
                }
                return null;
            }

            const streamUrl = getUrlParameter();

            if (streamUrl) {
                initPlayer(streamUrl);
            } else {
                showError("No video source provided. Use ?url=YOUR_STREAM_URL.m3u8");
            }

            // --- HLS INITIALIZATION ---
            function initPlayer(url) {
                if (Hls.isSupported()) {
                    hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true,
                        maxLiveSyncPlaybackRate: 1.5,
                        liveSyncDurationCount: 3,
                    });
                    
                    hls.loadSource(url);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                        setupQualityMenu(data.levels);
                        attemptAutoplay();
                    });

                    // Update Auto Quality Text when level switches (YouTube style)
                    hls.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
                        const autoItem = document.querySelector('.settings-item[data-level="-1"]');
                        if (autoItem) {
                            if (hls.autoLevelEnabled && hls.levels[data.level]) {
                                const height = hls.levels[data.level].height;
                                autoItem.innerText = `Auto (${height}p)`;
                            } else {
                                autoItem.innerText = 'Auto';
                            }
                        }
                    });
                    
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    // If manifest fails to load, the URL is likely invalid/dead. Kill it immediately.
                                    if (data.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR || 
                                        data.details === Hls.ErrorDetails.MANIFEST_PARSING_ERROR) {
                                        hls.destroy();
                                        showError("Playback Error: Stream not found or invalid URL.");
                                    } else {
                                        console.log("Network error, trying to recover...");
                                        hls.startLoad();
                                    }
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    console.log("Media error, recovering...");
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    hls.destroy();
                                    showError("Playback Error: Fatal stream error.");
                                    break;
                            }
                        }
                    });

                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    settingsBtn.style.display = 'none';
                    video.addEventListener('loadedmetadata', () => {
                        attemptAutoplay();
                    });
                } else {
                    showError("Playback Error: HLS is not supported in this browser.");
                }
            }

            // --- VIDEO CONTROLS LOGIC ---

            function togglePlay() {
                if (isErrorState) return;
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }

            playPauseBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                togglePlay();
            });

            centerPlay.addEventListener('click', (e) => {
                e.stopPropagation();
                togglePlay();
            });

            // Video Screen Click: Unmute if muted, else wake controls / double tap FS
            video.addEventListener('click', () => {
                if (isErrorState) return;

                // Instantly unmute on first tap if currently muted
                if (video.muted) {
                    video.muted = false;
                    if (video.volume === 0) {
                        video.volume = previousVolume > 0 ? previousVolume : 1;
                    }
                    updateVolumeUI();
                }

                if (clickTimer === null) {
                    clickTimer = setTimeout(() => {
                        clickTimer = null;
                        showControls(); 
                    }, 250);
                } else {
                    clearTimeout(clickTimer);
                    clickTimer = null;
                    toggleFullscreen(); 
                }
            });

            // UI State updates
            video.addEventListener('play', () => {
                container.classList.add('playing');
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                centerPlayIcon.style.display = 'none';
                centerPauseIcon.style.display = 'block';
                showControls();
            });

            video.addEventListener('pause', () => {
                container.classList.remove('playing');
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                centerPlayIcon.style.display = 'block';
                centerPauseIcon.style.display = 'none';
                showControls();
            });

            video.addEventListener('waiting', () => {
                if (!isErrorState) container.classList.add('loading');
            });
            
            video.addEventListener('playing', () => {
                container.classList.remove('loading');
            });

            // Volume Controls
            muteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                video.muted = !video.muted;
                if (!video.muted && video.volume === 0) {
                    video.volume = previousVolume > 0 ? previousVolume : 1; 
                }
            });

            volumeRange.addEventListener('input', (e) => {
                video.volume = e.target.value;
                video.muted = e.target.value === '0';
                if (video.volume > 0) previousVolume = video.volume; 
            });

            video.addEventListener('volumechange', updateVolumeUI);

            // Picture in Picture Logic
            if (document.pictureInPictureEnabled) {
                pipBtn.style.display = 'flex'; 
                pipBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (isErrorState) return;
                    try {
                        if (document.pictureInPictureElement) {
                            await document.exitPictureInPicture();
                        } else {
                            await video.requestPictureInPicture();
                        }
                    } catch (error) {
                        console.error("PiP Error:", error);
                    }
                });
            }

            // Fullscreen Logic
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    container.requestFullscreen().catch(err => console.log(err));
                } else {
                    document.exitFullscreen();
                }
            }

            fullscreenBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFullscreen();
            });

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    fsEnterIcon.style.display = 'none';
                    fsExitIcon.style.display = 'block';
                } else {
                    fsEnterIcon.style.display = 'block';
                    fsExitIcon.style.display = 'none';
                }
            });

            // Auto-hide Controls
            function showControls() {
                if (isErrorState) return;
                container.classList.remove('idle');
                clearTimeout(hideControlsTimeout);
                if (!video.paused) {
                    hideControlsTimeout = setTimeout(() => {
                        if (!settingsMenu.classList.contains('show')) {
                            container.classList.add('idle');
                        }
                    }, 2500);
                }
            }

            container.addEventListener('mousemove', showControls);
            container.addEventListener('mouseleave', () => {
                if (!video.paused && !settingsMenu.classList.contains('show')) {
                    container.classList.add('idle');
                }
            });

            // Quality Settings Menu
            function setupQualityMenu(levels) {
                qualityList.innerHTML = `<div class="settings-item active" data-level="-1">Auto</div>`;
                
                let sortedLevels = levels.map((l, i) => ({...l, originalIndex: i}))
                                         .sort((a, b) => b.height - a.height);
                                         
                sortedLevels.forEach(level => {
                    qualityList.innerHTML += `<div class="settings-item" data-level="${level.originalIndex}">${level.height}p</div>`;
                });

                const items = qualityList.querySelectorAll('.settings-item');
                items.forEach(item => {
                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const level = parseInt(item.getAttribute('data-level'));
                        if (hls) hls.currentLevel = level;
                        
                        items.forEach(i => i.classList.remove('active'));
                        item.classList.add('active');
                        
                        // If manual level selected, revert Auto text back to standard "Auto"
                        if (level !== -1) {
                            const autoItem = document.querySelector('.settings-item[data-level="-1"]');
                            if (autoItem) autoItem.innerText = 'Auto';
                        }
                        
                        settingsMenu.classList.remove('show');
                    });
                });
            }

            settingsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!isErrorState) settingsMenu.classList.toggle('show');
            });

            document.addEventListener('click', (e) => {
                if (!settingsMenu.contains(e.target) && e.target !== settingsBtn) {
                    settingsMenu.classList.remove('show');
                }
            });

            // Live Indicator Tracking
            video.addEventListener('timeupdate', () => {
                if (hls && hls.liveSyncPosition) {
                    if (hls.liveSyncPosition - video.currentTime > 15) {
                        liveDot.classList.add('behind');
                    } else {
                        liveDot.classList.remove('behind');
                    }
                }
            });

            // Sync back to live edge
            liveIndicator.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isErrorState) return;
                if (hls && hls.liveSyncPosition) {
                    video.currentTime = hls.liveSyncPosition;
                    video.play();
                } else if (video.seekable.length > 0) {
                    video.currentTime = video.seekable.end(video.seekable.length - 1);
                    video.play();
                }
            });
        });
    </script>
</body>
</html>
